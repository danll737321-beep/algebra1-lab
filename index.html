<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HS Math Visual Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#1f2937;--mute:#6b7280;--line:#e5e7eb;--bg:#f6f5f1;--x:#2563eb;--k:#ea580c;--ok:#15803d;--bad:#b91c1c;--rise:#7c3aed;--run:#059669;--acc:#2563eb}
*{box-sizing:border-box}
body{margin:0;font:17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
a{color:var(--acc)}
header.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px}
.brand{font-weight:800;font-size:18px;text-decoration:none;color:var(--ink)}
.brand span{color:var(--acc)}
.topprog{font-size:14px;color:var(--mute)}
.hdr-r{display:flex;align-items:center;gap:10px}.langbtn{min-height:34px;padding:4px 12px;font-size:14px;font-weight:700;border-radius:999px}
.wrap{max-width:900px;margin:0 auto;padding:12px 16px 60px}
h1{font-size:28px;line-height:1.25;margin:6px 0}
h2{font-size:22px;margin:28px 0 8px}
h3{font-size:19px;margin:4px 0 8px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0}
.tag{display:inline-block;font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--acc);margin-bottom:4px}
.mute{color:var(--mute)}
.math{font-family:"Cambria Math","STIX Two Math","Times New Roman",Georgia,serif;font-size:1.2em}
.big{font-size:1.5em}
i.v{color:var(--x);font-style:italic;font-weight:600}
.k{color:var(--k);font-weight:700}
.bad{color:var(--bad);font-weight:700}
.good{color:var(--ok);font-weight:700}
button,.btn{font:inherit;font-size:16px;cursor:pointer;border-radius:10px;border:1px solid #d1d5db;background:#fff;color:var(--ink);padding:9px 14px;min-height:44px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
button:hover,.btn:hover{border-color:var(--acc)}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary,.btn.primary{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
svg.fig{width:100%;height:auto;display:block;margin:6px auto}
.gl{stroke:#e5e7eb;stroke-width:1}.ax{stroke:#6b7280;stroke-width:1.6}.tl{font-size:12px;fill:#6b7280}
.ln{stroke:var(--x);stroke-width:3}
.touch{touch-action:none}
/* home */
.hero{background:linear-gradient(135deg,#eff6ff,#fff7ed)}
.flow{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 14px}
.flow span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:600;font-size:15px}
.bar{height:10px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:14px 0 4px}
.bar i{display:block;height:100%;background:var(--ok)}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.mod{background:#fff;border:1px solid var(--line);border-top:6px solid var(--mc);border-radius:14px;padding:14px}
.mod .mn{font-size:13px;font-weight:700;color:var(--mc);text-transform:uppercase;letter-spacing:.05em}
.mod b{display:block;font-size:18px;margin-bottom:6px}
.mod ol{list-style:none;padding:0;margin:0}
.mod li{padding:5px 0;border-top:1px solid #f3f4f6;font-size:15.5px}
.mod li a{display:flex;gap:8px;text-decoration:none;color:var(--ink);font-weight:600}
.mod li a:hover{color:var(--acc)}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 14px}.tabs a{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;text-decoration:none;color:var(--ink);font-weight:700;font-size:15px}.tabs a.on{background:var(--tc);border-color:var(--tc);color:#fff}.tabs a small{font-weight:600;opacity:.75;margin-left:4px}
.mod li.soon{color:#9ca3af;display:flex;gap:8px}
.mod li small{margin-left:auto;font-size:12px}
.st{width:20px;flex:none;text-align:center}
.st.d{color:var(--ok);font-weight:800}
/* lesson */
.crumb{font-size:14px;color:var(--mute);margin-top:8px}
.goal{background:#fff;border-left:5px solid var(--ok);padding:8px 12px;border-radius:8px;margin:8px 0 12px}
.stepper{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;position:sticky;top:57px;z-index:4;background:var(--bg);padding:6px 0}
.pill{white-space:nowrap;text-align:center;padding:9px 4px;border-radius:999px;border:1px solid #d1d5db;background:#fff;font-weight:700;font-size:15px;text-decoration:none;color:var(--ink)}
.pill.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.pill.done:not(.on){border-color:var(--ok);color:var(--ok)}
.pill.done::after{content:" ✓"}
.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.life{border-left:6px solid var(--k)}
.life .tag{color:var(--k)}
dl.vocab{margin:0}
dl.vocab dt{font-weight:800;margin-top:8px}
dl.vocab dd{margin:0 0 0 0;color:#374151}
.note{min-height:52px;margin-top:8px;padding:10px 12px;background:#f9fafb;border-radius:10px}
.eqline{text-align:center;font-size:1.7em;margin-top:4px}
/* steps */
.ln-step{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;align-items:center;padding:10px 0;border-top:1px dashed #e5e7eb;animation:fade .35s}
.ln-step .m{font-size:1.3em;text-align:center}
.ln-step .why{font-size:15.5px;color:#374151;background:#f9fafb;border-radius:8px;padding:6px 10px}
.ln-step.hide{display:none}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.prob{font-size:18px}
.mistake{border-left:6px solid var(--bad)}
.mistake .tag{color:var(--bad)}
.mk{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.mk div{padding:10px;border-radius:10px;text-align:center}
.mk .x{background:#fef2f2}.mk .o{background:#f0fdf4}
/* practice */
.pencilnote{background:#fffbeb;border:1px dashed #f59e0b;border-radius:10px;padding:8px 12px;margin:8px 0 12px;font-size:15.5px}
.fld{display:inline-flex;align-items:center;gap:8px;margin:6px 14px 6px 0;font-weight:700}
.fld input{font:inherit;font-size:18px;width:120px;padding:8px 10px;border:2px solid #d1d5db;border-radius:10px}
.fld input:focus{outline:none;border-color:var(--acc)}
.opt{display:flex;width:100%;text-align:left;margin:6px 0;justify-content:flex-start}
.opt.right{background:#f0fdf4;border-color:var(--ok);color:var(--ok);font-weight:700}
.opt.wrong{background:#fef2f2;border-color:var(--bad);color:var(--bad)}
.opt.sel{border:2px solid var(--acc);background:#eff6ff}
.fb{margin-top:10px;font-weight:600;min-height:1em}
.fb.okk{color:var(--ok)}.fb.no{color:var(--bad)}
.solbox{margin-top:10px;background:#f9fafb;border-radius:10px;padding:8px 12px}
.streak{margin-top:12px;font-size:14.5px;color:var(--mute)}
table.t{border-collapse:collapse;margin:8px 0}
table.t td,table.t th{border:1px solid #d1d5db;padding:5px 14px;text-align:center}
table.t th{background:#f3f4f6}
/* quiz */
.qq{padding:12px 0;border-top:1px solid var(--line)}
.qq .why{display:none;margin-top:6px;font-size:15.5px;background:#f9fafb;border-radius:8px;padding:6px 10px}
.qq.shown .why{display:block}
.done-banner{background:#f0fdf4;border:1px solid #86efac;border-radius:12px;padding:14px;margin-top:12px;font-weight:700}
/* widgets */
.ctrl{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin:6px 0}
.ctrl label{font-weight:700;display:flex;align-items:center;gap:8px}
input[type=range]{width:200px;accent-color:var(--acc)}
.readout{margin-top:8px;padding:10px 12px;background:#f9fafb;border-radius:10px}
.anat{display:flex;justify-content:center;align-items:flex-start;gap:10px;flex-wrap:wrap;margin:8px 0}
.term{text-align:center}
.tbox{font-family:"Cambria Math","Times New Roman",serif;font-size:42px;border:3px solid #d1d5db;border-radius:12px;padding:2px 16px;background:#fff}
.tl{font-size:14px;color:#374151;margin-top:4px;max-width:150px}
.op{font-size:42px;padding-top:6px}
.legend{display:flex;flex-wrap:wrap;gap:10px 20px;justify-content:center;font-size:15px}
.stepper2{display:inline-flex;align-items:center;gap:6px}
.stepper2 b{min-width:26px;text-align:center;font-size:20px}
.darts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center;font-size:14px}
.darts b{display:block}
.tri-btns button.on{background:#fef9c3;border-color:#ca8a04;font-weight:800}
@media (max-width:640px){
 .topprog{display:none} .brand{font-size:16px;white-space:nowrap}
 body{font-size:16px}
 h1{font-size:23px}
 .ln-step{grid-template-columns:1fr;gap:4px}
 .darts{grid-template-columns:repeat(2,1fr)}
 .pill{font-size:13px;padding:9px 2px} .pill .ic{display:none}
 .stepper{top:53px}
 .tbox{font-size:32px}.op{font-size:32px}
 input[type=range]{width:150px}
}
.sys{display:inline-block;border-left:3px solid #374151;border-radius:12px 0 0 12px;padding:2px 14px;margin:6px 0;font-family:"Cambria Math","Times New Roman",serif;font-size:1.25em;line-height:1.5;text-align:left}
.tile{background:#fef08a;border-radius:6px;padding:0 5px;box-shadow:0 0 0 2px #eab308 inset}
.gone{text-decoration:line-through;text-decoration-thickness:3px;text-decoration-color:#b91c1c;opacity:.55}
table.eqt{border-collapse:collapse;margin:8px auto;font-family:"Cambria Math","Times New Roman",serif;font-size:1.3em}
table.eqt td{padding:4px 10px;text-align:right}
table.eqt tr.sum td{border-top:3px solid #374151;font-weight:700}
.sel{border:2px solid var(--acc)!important;background:#eff6ff!important}
footer{text-align:center;font-size:13px;color:var(--mute);padding:20px}

/* ============ VISUAL REFRESH 2026 ============ */

 --ink:#17243a;--mute:#64748b;--line:#e2e8f0;--bg:#f4f7fb;
 --x:#2563eb;--acc:#2563eb;--k:#c2410c;--ok:#15803d;--bad:#b91c1c;
 --surface:#fff;--surface-soft:#f8fafc;--shadow:0 10px 30px rgba(15,23,42,.06);
 --shadow-hover:0 16px 36px rgba(15,23,42,.11);
}

header.top{min-height:64px;padding:10px clamp(16px,3vw,36px);background:rgba(255,255,255,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 1px 0 rgba(15,23,42,.04)}

.tabs a:not(.on):hover{background:#eff6ff;border-color:#bfdbfe;color:#1d4ed8}
.goal{border-left:4px solid #0d9488;background:linear-gradient(90deg,#ecfdf5,#fff 85%);border-radius:0 12px 12px 0;padding:12px 16px}
.stepper{top:63px;gap:8px;padding:9px 0;background:rgba(244,247,251,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.pill{border-radius:12px;padding:10px 8px;border-color:#dbe3ee;font-size:14px;box-shadow:0 2px 6px rgba(15,23,42,.035);transition:all .15s ease}
.pill.on{box-shadow:0 5px 14px rgba(37,99,235,.2)}
.pill.done:not(.on){background:#f0fdf4;border-color:#86efac}
button,.btn{border-radius:11px;border-color:#d7e0eb;font-weight:600;transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease,background .15s ease}

button.primary:hover,.btn.primary:hover{background:linear-gradient(135deg,#1d4ed8,#1e40af);box-shadow:0 7px 17px rgba(37,99,235,.22)}
button:focus-visible,.btn:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid rgba(59,130,246,.42);outline-offset:3px}

.mk div{border:1px solid rgba(226,232,240,.8)}

.opt.right{background:#f0fdf4;border-color:#86efac}
.opt.wrong{background:#fff1f2;border-color:#fda4af}

.fld input:focus{box-shadow:0 0 0 4px rgba(37,99,235,.1)}

svg.fig{max-width:760px;overflow:visible}
.qq{padding:16px 0}

 header.top{min-height:58px;padding:8px 14px}

}

h1 .h1en{display:block;font-size:.5em;font-weight:500;opacity:.6;margin-top:4px}

/* ============ INTERACTIVE SLOPE EXPLORER ============ */
.slope-lab{background:linear-gradient(135deg,#f8fbff,#fff);border-color:#cbdcf5}
.slope-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.slope-head h2{margin:0 0 4px}
.slope-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(220px,.8fr);gap:18px;align-items:center;margin-top:14px}
.slope-plot{min-width:0;background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:8px}
.slope-plot svg{width:100%;height:auto;display:block}
.slope-controls{display:grid;gap:14px}
.slope-control{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:12px}
.slope-control label{display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:14px}
.slope-control output{font-variant-numeric:tabular-nums;color:#1d4ed8}
.slope-control input{width:100%;margin:10px 0 0;accent-color:#2563eb}
.slope-equation{font:700 clamp(20px,3vw,28px)/1.3 "Cambria Math",Georgia,serif;color:#1d4ed8;text-align:center;background:#eff6ff;border:1px solid #bfdbfe;border-radius:12px;padding:13px}
.slope-insight{font-size:14px;color:#475569;line-height:1.55}
.slope-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:#64748b;padding:4px 2px}
.slope-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#0f766e;margin-right:5px}
@media(max-width:680px){.slope-grid{grid-template-columns:1fr}.slope-controls{grid-template-columns:1fr 1fr}.slope-equation,.slope-insight{grid-column:1/-1}}
@media(max-width:420px){.slope-controls{grid-template-columns:1fr}}
/* ============ END INTERACTIVE SLOPE EXPLORER ============ */


/* ============ INTERACTIVE ALGEBRA TILES 2026 ============ */
.visual-labs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:16px 0 26px}
.visual-lab{min-width:0;background:linear-gradient(145deg,#fff,#f8fbff);border:1px solid #dbe5f2;border-radius:18px;padding:clamp(16px,2vw,22px);box-shadow:var(--shadow)}
.visual-lab-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px}
.visual-lab-head h2{margin:0 0 4px}
.lab-kicker{font-size:11px;font-weight:800;letter-spacing:.12em;color:#2563eb}
.tile-stage{display:grid;grid-template-columns:1fr;gap:12px;margin:14px 0}
.tile-group{background:#fff;border:1px solid #e2e8f0;border-radius:13px;padding:12px;min-height:106px}
.tile-group-title{font-size:12px;font-weight:750;color:#64748b;margin-bottom:9px}

/* ============ KHAN-STYLE MINIMAL THEME (final layer) ============ */
:root{--kb:#1865f2;--kb-d:#1b50b3;--kb-soft:#e8f0fe;--k-ink:#21242c;--k-mute:#5f6368;--k-line:#d6d8da;--k-bg:#f7f8fa;--acc:#1865f2;--alg-blue:#1865f2}
body{font-family:Lato,"Noto Sans TC",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#fff;color:var(--k-ink);letter-spacing:0}
h1,h2,h3,.brand{font-family:Lato,"Noto Sans TC",ui-sans-serif,system-ui,sans-serif;letter-spacing:0}
h1{font-weight:900}h2{font-weight:700}
header.top{background:#fff;border-bottom:1px solid var(--k-line);box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;min-height:56px}
.brand{color:var(--k-ink);font-weight:900}.brand span{color:var(--kb)}
.langbtn{border-radius:4px}
.card,.hero,.unit-panel,.course-sidebar,.visual-lab,.slope-lab,.unit-diagnostic,.unit-goal,.unit-callout,.unit-hero{box-shadow:none!important;background:#fff;border:1px solid var(--k-line);border-radius:8px;transition:none}
.card:hover,.mod:hover{transform:none;box-shadow:none}
/* buttons */
button,.btn{border-radius:4px;border:1px solid var(--k-line);background:#fff;color:var(--k-ink);font-weight:700;box-shadow:none;transition:background .1s,border-color .1s}
button:hover,.btn:hover{transform:none;box-shadow:none;border-color:var(--kb);color:var(--kb)}
button.primary,.btn.primary{background:var(--kb);border-color:var(--kb);color:#fff;box-shadow:none}
button.primary:hover,.btn.primary:hover{background:var(--kb-d);border-color:var(--kb-d);color:#fff;box-shadow:none}
/* course tabs: underline style */
.course-tabs{gap:0;border-bottom:1px solid var(--k-line);padding:0;margin:0 0 22px;overflow-x:auto}
.course-tabs a,.course-tabs a.on{border:0;border-radius:0;background:none;color:var(--k-mute);padding:14px 16px 12px;font-weight:700;font-size:15px;border-bottom:4px solid transparent;margin-bottom:-1px}
.course-tabs a:not(.on):hover{background:none;color:var(--kb)}
.course-tabs a.on{color:var(--kb);border-bottom-color:var(--kb)}
.course-tabs small{font-weight:400;color:#9aa0a6;margin-left:4px}
/* course header */
.course-progress{background:none;border:0;border-bottom:1px solid var(--k-line);border-radius:0;padding:4px 0 20px;margin:0 0 24px}
.course-progress h1{font-size:clamp(26px,3.4vw,34px)}
.course-progress .flow{gap:0;margin:12px 0 4px}
.course-progress .flow span{background:none;border:0;border-radius:0;padding:0 12px 0 0;font-size:14px;font-weight:700;color:var(--k-mute)}
.course-progress .flow span+span:before{content:"→";margin-right:12px;color:#bdc1c6}
.bar,.unit-progress{height:8px;background:#e8eaed;border-radius:4px}
.bar>i,.unit-progress>i,.unit-panel .unit-progress>i{background:var(--kb);border-radius:4px}
/* sidebar */
.course-sidebar{border:0;border-right:1px solid var(--k-line);border-radius:0;padding:0 14px 0 0;background:#fff;top:72px}
.sidebar-heading{color:var(--k-mute);margin:0 8px 10px;letter-spacing:.06em}
.sidebar-units{gap:0}
.side-unit,.side-unit.open{background:none;box-shadow:none;border-radius:0}
.sidebar-unit,.sidebar-unit.active{border:0;border-radius:4px;padding:10px 10px;margin:0}
.sidebar-unit:hover{background:var(--k-bg);color:var(--k-ink)}
.sidebar-unit.active{background:var(--kb-soft)}
.sidebar-unit span{color:var(--k-ink);font-size:13px;font-weight:700}
.sidebar-unit.active span{color:var(--kb)}
.sidebar-unit small{color:var(--k-mute);font-size:13px}
.sidebar-unit span em{color:var(--k-mute);font-weight:400}
.su-bar{height:3px;background:#e8eaed}.su-bar b{background:var(--kb)}
.side-lessons{padding:4px 0 8px 10px;margin:0}
.side-lessons a,.side-lessons li.soon{border-radius:4px;padding:6px 8px}
.side-lessons a:hover{background:var(--k-bg);color:var(--k-ink)}
.side-lessons a.cur{color:var(--kb)}
.side-lessons .st.d{color:var(--kb)}
/* unit panel */
.unit-panel{border:0;border-radius:0;padding:0}
.unit-panel .unit-kicker{color:var(--k-mute);letter-spacing:.06em}
.unit-panel h2{font-size:clamp(22px,3vw,28px);font-weight:900;margin:6px 0 10px}
.unit-lesson-list{gap:0;border:1px solid var(--k-line);border-radius:8px;overflow:hidden}
.unit-lesson-list li+li{border-top:1px solid var(--k-line)}
.unit-lesson-list a,.unit-lesson-list li.soon{border:0;border-radius:0;padding:14px 16px}
.unit-lesson-list a:hover{background:var(--k-bg);border:0}
.unit-lesson-list b{font-weight:700}
.unit-lesson-list li.soon{background:#fff;color:#9aa0a6}
.unit-lesson-num,.unit-lesson-num.d{width:28px;height:28px;flex:0 0 28px;border-radius:50%;background:#fff;border:2px solid #bdc1c6;color:var(--k-mute);font-size:12px}
.unit-lesson-num.d{background:var(--kb);border-color:var(--kb);color:#fff}
.unit-lesson-list .tag{color:var(--kb);font-size:11px}
.interactive-tools-heading{border-top:1px solid var(--k-line)}
.lab-kicker,.tag,.unit-kicker,.unit-eyebrow{color:var(--k-mute)}
.unit-callout{border-left:4px solid var(--kb);background:var(--k-bg)}
.unit-diagnostic{background:#fff}
.hero:before,.hero:after{display:none!important}
.goal{background:var(--k-bg);border-left:4px solid var(--kb);border-radius:0 4px 4px 0}

const MINUS='−';
function fmtNeg(n){n=+(+n).toFixed(4);return (n<0?MINUS:'')+Math.abs(n);}
function frac(n,d){if(d<0){n=-n;d=-d;}const g=gcd(Math.abs(n),d)||1;n/=g;d/=g;return d===1?fmtNeg(n):(n<0?MINUS:'')+Math.abs(n)+'/'+d;}
function T(c,v){return c===1?v:c===-1?MINUS+v:fmtNeg(c)+v;}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function mcFrom(correct,wrongs){const opts=shuffle([correct,...wrongs]);return {opts,a:opts.indexOf(correct)};}
function parseAns(s){s=String(s).trim().replace(/[−–]/g,'-').replace(/\s+/g,'').replace(/^\$/,'').replace(/%$/,'').replace(/,/g,'');
 if(!s)return NaN;

 if(/^-?(\d+\.?\d*|\.\d+)$/.test(s))return Number(s);
 return NaN;}

ion is not a solution to the system.':'聯立方程式的解必須同時滿足所有方程式。只符合其中一個方程式的點，並不是這組聯立方程式的解。','Course overview':'課程總覽','ALGEBRA 1':'代數一','Unit 4: Linear Equations & Graphs':'第 4 單元：線性方程式與圖形','Linear Equations & Graphs':'線性方程式與圖形','Connect equations, slope, and graphs. Learn how a linear relationship appears in different forms.':'連結方程式、斜率與圖形，理解線性關係的不同表示方式。','Read a graph':'讀懂圖形','Identify solutions, intercepts, and key points on a line.':'辨識解、截距，以及直線上的關鍵點。','Interpret slope':'解讀斜率','Explain rise over run and connect slope to a rate of change.':'說明升高量與水平移動量的比值，並連結到變化率。','Connect representations':'連結不同表示法','Move between equations, ordered pairs, graphs, and contexts.':'在方程式、有序數對、圖形與生活情境之間轉換。','Two-Variable Linear Equations Intro':'二元線性方程式導論','Understand ordered-pair solutions and see why they form a line.':'理解有序數對解，並觀察它們如何形成一條直線。','Slope':'斜率','Measure steepness as rise over run and interpret its meaning.':'以升高量除以水平移動量衡量陡峭程度，並解讀其意義。','Horizontal and Vertical Lines':'水平線與垂直線','Compare slope 0 with undefined slope.':'比較斜率為 0 與斜率不存在的情況。','x- and y-Intercepts':'x 截距與 y 截距','Find where a line crosses each axis and use those points to graph.':'找出直線與兩軸的交點，並利用這些點繪圖。','Applying Intercepts and Slope':'應用截距與斜率','Use slope and intercepts to model and interpret a real situation.':'運用斜率與截距建立模型，並解讀實際情境。','What does the point (3, 7) mean on a graph?':'圖形上的點 (3, 7) 代表什麼？','x = 7 and y = 3':'x = 7 且 y = 3','x = 3 and y = 7':'x = 3 且 y = 7','The slope is 7':'斜率是 7','Ordered pairs are written (x, y): move 3 units across, then 7 units up.':'有序數對寫作 (x, y)：先向右移動 3，再向上移動 7。','A line rises 6 units when it runs 3 units to the right. What is its slope?':'一條直線向右移動 3 單位時上升 6 單位，斜率是多少？','Which statement about a horizontal line is true?':'關於水平線，哪個敘述正確？','Its slope is undefined':'斜率不存在','Its slope is 0':'斜率為 0','It has no y-intercept':'沒有 y 截距','Slope = rise ÷ run = 6 ÷ 3 = 2.':'斜率 = 升高量 ÷ 水平移動量 = 6 ÷ 3 = 2。','A horizontal line has no vertical change, so rise = 0 and slope = 0.':'水平線沒有垂直變化，因此升高量為 0，斜率也為 0。', let GID=0;
function grid(o){
 const {x0=-6,x1=6,y0=-6,y1=6,u=30,lab=2,xl='',yl='',gs=1}=o;const uy=o.uy||u,laby=o.laby||lab,gsy=o.gsy||gs;const pad=28;
 const W=(x1-x0)*u+pad*2,H=(y1-y0)*uy+pad*2+(xl?22:0);const X=x=>pad+(x-x0)*u,Y=y=>pad+(y1-y)*uy;const id='clp'+(++GID);
 let s=`<defs><clipPath id="${id}"><rect x="${X(x0)}" y="${Y(y1)}" width="${(x1-x0)*u}" height="${(y1-y0)*uy}"/></clipPath></defs>`;
 for(let x=x0;x<=x1;x++)if(x%gs===0)s+=`<line x1="${X(x)}" y1="${Y(y0)}" x2="${X(x)}" y2="${Y(y1)}" class="gl"/>`;
 for(let y=y0;y<=y1;y++)if(y%gsy===0)s+=`<line x1="${X(x0)}" y1="${Y(y)}" x2="${X(x1)}" y2="${Y(y)}" class="gl"/>`;
 const ay=(y0<=0&&y1>=0)?Y(0):Y(y0),axx=(x0<=0&&x1>=0)?X(0):X(x0);
 s+=`<line x1="${X(x0)}" y1="${ay}" x2="${X(x1)}" y2="${ay}" class="ax"/><line x1="${axx}" y1="${Y(y0)}" x2="${axx}" y2="${Y(y1)}" class="ax"/>`;
 for(let x=x0;x<=x1;x++)if(x!==0&&x%lab===0)s+=`<text x="${X(x)}" y="${ay+16}" text-anchor="middle" class="tl">${fmtNeg(x)}</text>`;
 for(let y=y0;y<=y1;y++)if(y!==0&&y%laby===0)s+=`<text x="${axx-6}" y="${Y(y)+4}" text-anchor="end" class="tl">${fmtNeg(y)}</text>`;
 if(xl)s+=`<text x="${X((x0+x1)/2)}" y="${Y(y0)+40}" text-anchor="middle" class="tl" font-weight="700">${xl} →</text>`;
 if(yl)s+=`<text x="${axx+6}" y="${Y(y1)-8}" class="tl" font-weight="700">${yl}</text>`;
 return {W,H,X,Y,x0,x1,y0,y1,u,uy,clip:id,base:s,svg:inner=>`<svg viewBox="0 0 ${W} ${H}" class="fig" style="max-width:${Math.min(W,480)}px">${s}${inner}</svg>`};
}
function gline(g,m,b,cls='ln',extra=''){const a=g.x0-1,z=g.x1+1;return `<line clip-path="url(#${g.clip})" x1="${g.X(a)}" y1="${g.Y(m*a+b)}" x2="${g.X(z)}" y2="${g.Y(m*z+b)}" class="${cls}" ${extra}/>`;}
function gdot(g,x,y,col='#1f2937',r=6,label=''){return `<circle cx="${g.X(x)}" cy="${g.Y(y)}" r="${r}" fill="${col}" stroke="#fff" stroke-width="2"/>`+(label?`<text x="${g.X(x)+9}" y="${g.Y(y)-9}" font-size="13" font-weight="700" fill="${col}" paint-order="stroke" stroke="#fff" stroke-width="4">${label}</text>`:'');}

// Balance scale
function scaleSVG(L,R,a){
 const r=a*Math.PI/180,cx=280,cy=110,len=190;
 const lx=cx-len*Math.cos(r),ly=cy-len*Math.sin(r),rx=cx+len*Math.cos(r),ry=cy+len*Math.sin(r);
 let s=`<path d="M${cx} ${cy} L${cx} 262" stroke="#9ca3af" stroke-width="10"/><path d="M${cx-70} 290 L${cx+70} 290 L${cx+34} 262 L${cx-34} 262Z" fill="#9ca3af"/>`;
 s+=`<line x1="${lx}" y1="${ly}" x2="${rx}" y2="${ry}" stroke="#4b5563" stroke-width="9" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="10" fill="#374151"/>`;
 return s+pan(lx,ly,L)+pan(rx,ry,R);
}
function pan(x,y,c){
 const py=y+100;let s=`<line x1="${x}" y1="${y}" x2="${x-72}" y2="${py}" stroke="#9ca3af" stroke-width="2"/><line x1="${x}" y1="${y}" x2="${x+72}" y2="${py}" stroke="#9ca3af" stroke-width="2"/><path d="M${x-86} ${py} Q${x} ${py+30} ${x+86} ${py}Z" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>`;
 const base=py-1,left=x-80;
 for(let i=0;i<(c.x||0);i++){const bx=left+i*40;s+=`<rect x="${bx}" y="${base-36}" width="36" height="36" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><text x="${bx+18}" y="${base-11}" text-anchor="middle" font-size="22" font-style="italic" font-weight="700" fill="#2563eb" font-family="Georgia,serif">x</text>`;}
 const x0=left+(c.x||0)*40,w=160-(c.x||0)*40,cols=Math.max(1,Math.floor(w/18));
 for(let i=0;i<(c.k||0);i++){const col=i%cols,row=Math.floor(i/cols);s+=`<rect x="${x0+col*18}" y="${base-16-row*18}" width="16" height="16" rx="2" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/>`;}
 const lbl=[(c.x?T(c.x,'x'):''),(c.k?String(c.k):'')].filter(Boolean).join(' + ');
 s+=`<text x="${x}" y="${py+40}" text-anchor="middle" font-size="18" font-weight="700" fill="#374151">${lbl}</text>`;
 return s;
}

 el.innerHTML=`<svg viewBox="0 0 600 170" class="fig" style="max-width:600px"></svg><div class="ctrl"><label>Hours worked <i class="v">h</i> <input type="range" min="0" max="8" step="0.5" value="2"></label></div><div class="readout"></div>`;
 const sc=520/480,x0=30,X=v=>x0+v*sc;
 const draw=()=>{const h=+$('input',el).value,tot=40+50*h;let s=`<line x1="${X(315)}" y1="22" x2="${X(315)}" y2="120" stroke="#b91c1c" stroke-width="2.5" stroke-dasharray="6 4"/><text x="${X(315)}" y="16" text-anchor="middle" font-size="14" font-weight="800" fill="#b91c1c">Bill: $315</text>`;
  s+=`<rect x="${X(0)}" y="40" width="${40*sc}" height="56" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/><text x="${X(20)}" y="73" text-anchor="middle" font-size="13" font-weight="700" fill="#9a3412">$40</text>`;
  let pos=40;for(let i=0;i<Math.ceil(h);i++){const part=Math.min(1,h-i),w=50*part;s+=`<rect x="${X(pos)}" y="40" width="${w*sc}" height="56" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="${X(pos+w/2)}" y="73" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">$${w}</text>`;pos+=w;}
  for(let v=0;v<=400;v+=100)s+=`<line x1="${X(v)}" y1="100" x2="${X(v)}" y2="108" stroke="#6b7280"/><text x="${X(v)}" y="124" text-anchor="middle" class="tl">$${v}</text>`;
  s+=`<text x="${X(0)}" y="152" font-size="13" fill="#9a3412" font-weight="700">■ $40 house call (starting amount)</text><text x="${X(250)}" y="152" font-size="13" fill="#1e40af" font-weight="700">■ $50 for each hour (rate)</text>`;
  $('svg',el).innerHTML=s;
  const msg=tot<315?'<span class="mute">Too low — slide to more hours.</span>':tot>315?'<span class="bad">Too high — slide back.</span>':'<span class="good">✓ Matches the bill! The plumber worked 5.5 hours.</span>';
  $('.readout',el).innerHTML=`<span class="math"><span class="k">40</span> + <span class="k">50</span>${mx('h')} = 40 + 50(${h}) = <b>$${tot}</b></span><br>${msg}`;};
 $('input',el).addEventListener('input',draw);draw();
}
// Formula triangle
function mountTriangle(el){
 let solve='t';
 el.innerHTML=`<div class="row tri-btns" style="justify-content:center"><button data-v="d">Find d (distance)</button><button data-v="r">Find r (rate)</button><button data-v="t">Find t (time)</button></div>
 <svg viewBox="0 0 300 215" class="fig" style="max-width:300px"></svg><div class="eqline math"></div><div class="readout"></div>`;
 const reg={d:'150,12 85.8,110 214.2,110',r:'85.8,110 23,205 150,205 150,110',t:'150,110 150,205 277,205 214.2,110'};
 const pos={d:[150,88],r:[108,172],t:[192,172]};
 const F={d:['d = r · t','Cover <b>d</b>: you see <b>r</b> next to <b>t</b> → multiply.'],r:['r = d ÷ t','Cover <b>r</b>: you see <b>d</b> over <b>t</b> → divide.'],t:['t = d ÷ r','Cover <b>t</b>: you see <b>d</b> over <b>r</b> → divide.']};
 const draw=()=>{let s='';for(const v of ['d','r','t'])s+=`<polygon points="${reg[v]}" fill="${v===solve?'#fef08a':'#fff'}" stroke="#374151" stroke-width="2.5"/><text x="${pos[v][0]}" y="${pos[v][1]}" text-anchor="middle" font-size="40" font-style="italic" font-weight="700" fill="${v===solve?'#a16207':'#2563eb'}" font-family="Georgia,serif">${v===solve?'?':v}</text>`;
  $('svg',el).innerHTML=s;$$('.tri-btns button',el).forEach(b=>b.classList.toggle('on',b.dataset.v===solve));
  $('.eqline',el).innerHTML=mx(F[solve][0]);
  const ex={t:'Road trip: 270 miles at 60 mph → t = 270 ÷ 60 = <b>4.5 hours</b>',r:'You drove 270 miles in 4.5 hours → r = 270 ÷ 4.5 = <b>60 mph</b>',d:'60 mph for 4.5 hours → d = 60 × 4.5 = <b>270 miles</b>'};
  $('.readout',el).innerHTML=F[solve][1]+'<br>'+ex[solve];};
 el.addEventListener('click',e=>{const v=e.target.closest('button')?.dataset.v;if(v){solve=v;draw();}});draw();
}
function undoMachine(){
 const box=(x,y,t,c)=>`<rect x="${x}" y="${y}" width="74" height="44" rx="10" fill="${c}" stroke="#374151" stroke-width="2"/><text x="${x+37}" y="${y+29}" text-anchor="middle" font-size="20" font-weight="700" font-family="Georgia,serif">${t}</text>`;
 const arr=(x,y,t,col)=>`<line x1="${x}" y1="${y}" x2="${x+62}" y2="${y}" stroke="${col}" stroke-width="3" marker-end="url(#ah${col.slice(1)})"/><text x="${x+31}" y="${y-8}" text-anchor="middle" font-size="16" font-weight="800" fill="${col}">${t}</text>`;
 let s=`<defs>${['2563eb','15803d'].map(c=>`<marker id="ah${c}" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#${c}"/></marker>`).join('')}</defs>`;
 s+=`<text x="10" y="22" font-size="14" font-weight="700" fill="#2563eb">Building A = ½bh (what happens to h):</text>`;
 s+=box(10,34,'h','#dbeafe')+arr(90,56,'× b','#2563eb')+box(160,34,'bh','#fff')+arr(240,56,'× ½','#2563eb')+box(310,34,'A','#fed7aa');
 s+=`<text x="10" y="122" font-size="14" font-weight="700" fill="#15803d">Solving for h (undo in REVERSE order):</text>`;
 s+=box(10,134,'A','#fed7aa')+arr(90,156,'× 2','#15803d')+box(160,134,'2A','#fff')+arr(240,156,'÷ b','#15803d')+box(310,134,'h','#dbeafe');
 s+=`<text x="400" y="162" font-size="18" font-weight="700" font-family="Georgia,serif" fill="#15803d">h = 2A ÷ b</text>`;
 return `<svg viewBox="0 0 520 190" class="fig" style="max-width:520px">${s}</svg><p class="mute" style="text-align:center">Like taking off shoes and socks: you put socks on first, so you take them off last.</p>`;

// Slope explorer
function mountSlope(el){
 const g=grid({u:32});let A={x:-3,y:-2},B={x:3,y:2},drag=null;
 el.innerHTML=`<svg viewBox="0 0 ${g.W} ${g.H}" class="fig touch" style="max-width:480px"></svg><div class="readout"></div>
 <div class="row"><button data-p="up">Goes up ↗</button><button data-p="down">Goes down ↘</button><button data-p="flat">Flat →</button><button data-p="vert">Vertical ↑</button></div>`;
 const svg=$('svg',el);
 const draw=()=>{const rise=B.y-A.y,run=B.x-A.x;let s='';
  if(run===0)s+=`<line x1="${g.X(A.x)}" y1="${g.Y(g.y0)}" x2="${g.X(A.x)}" y2="${g.Y(g.y1)}" class="ln"/>`;else s+=gline(g,rise/run,A.y-rise/run*A.x);
  if(run!==0){s+=`<line x1="${g.X(A.x)}" y1="${g.Y(A.y)}" x2="${g.X(B.x)}" y2="${g.Y(A.y)}" stroke="#059669" stroke-width="4"/>`;const ly=g.Y(A.y)+(rise>0?20:-10);s+=`<text x="${g.X((A.x+B.x)/2)}" y="${ly}" text-anchor="middle" font-size="15" font-weight="800" fill="#059669" paint-order="stroke" stroke="#fff" stroke-width="5">run ${fmtNeg(run)}</text>`;}
  if(rise!==0){s+=`<line x1="${g.X(B.x)}" y1="${g.Y(A.y)}" x2="${g.X(B.x)}" y2="${g.Y(B.y)}" stroke="#7c3aed" stroke-width="4"/>`;const right=B.x<4;s+=`<text x="${g.X(B.x)+(right?8:-8)}" y="${g.Y((A.y+B.y)/2)+5}" text-anchor="${right?'start':'end'}" font-size="15" font-weight="800" fill="#7c3aed" paint-order="stroke" stroke="#fff" stroke-width="5">rise ${fmtNeg(rise)}</text>`;}
  for(const [k,p] of [['A',A],['B',B]])s+=`<circle data-pt="${k}" cx="${g.X(p.x)}" cy="${g.Y(p.y)}" r="13" fill="${k==='A'?'#ea580c':'#1f2937'}" stroke="#fff" stroke-width="3" style="cursor:grab"/><text x="${g.X(p.x)}" y="${g.Y(p.y)+5}" text-anchor="middle" font-size="13" font-weight="800" fill="#fff" pointer-events="none">${k}</text>`;
  svg.innerHTML=g.base+s;
  const sl=run===0?'<b class="bad">undefined</b> (you can’t divide by 0)':`<b>${frac(rise,run)}</b>`;
  const d=run===0?'Vertical line → slope is <b>undefined</b>.':rise===0?'Horizontal line → slope is <b>0</b>.':(rise/run>0?'Slope is <b>positive</b>: the line goes UP as you read left to right.':'Slope is <b>negative</b>: the line goes DOWN as you read left to right.');
  $('.readout',el).innerHTML=`<span class="mute">Drag point A or B.</span> A(${fmtNeg(A.x)}, ${fmtNeg(A.y)}) &nbsp; B(${fmtNeg(B.x)}, ${fmtNeg(B.y)})<br><span style="color:#7c3aed;font-weight:700">rise = ${fmtNeg(B.y)} − ${P(A.y)} = ${fmtNeg(rise)}</span> &nbsp; <span style="color:#059669;font-weight:700">run = ${fmtNeg(B.x)} − ${P(A.x)} = ${fmtNeg(run)}</span><br>slope = rise ÷ run = ${sl}<br>${d}`;};
 const toG=e=>{const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const p=pt.matrixTransform(svg.getScreenCTM().inverse());return {x:Math.max(g.x0,Math.min(g.x1,Math.round((p.x-28)/g.u+g.x0))),y:Math.max(g.y0,Math.min(g.y1,Math.round(g.y1-(p.y-28)/g.u)))};};
 svg.addEventListener('pointerdown',e=>{const t=e.target.closest('[data-pt]');if(!t)return;drag=t.dataset.pt;svg.setPointerCapture(e.pointerId);e.preventDefault();});
 svg.addEventListener('pointermove',e=>{if(!drag)return;const p=toG(e),o=drag==='A'?B:A;if(p.x===o.x&&p.y===o.y)return;const c=drag==='A'?A:B;if(c.x===p.x&&c.y===p.y)return;c.x=p.x;c.y=p.y;draw();});
 svg.addEventListener('pointerup',()=>drag=null);svg.addEventListener('pointercancel',()=>drag=null);
 el.addEventListener('click',e=>{const p=e.target.closest('button')?.dataset.p;if(!p)return;({up:()=>{A={x:-3,y:-2};B={x:3,y:2}},down:()=>{A={x:-4,y:3};B={x:2,y:-1}},flat:()=>{A={x:-4,y:2};B={x:3,y:2}},vert:()=>{A={x:2,y:-3};B={x:2,y:4}}})[p]();draw();});
 draw();
}
// Slope-intercept explorer
const MS=[[-3,1],[-2,1],[-3,2],[-1,1],[-2,3],[-1,2],[-1,3],[0,1],[1,3],[1,2],[2,3],[3,4],[1,1],[3,2],[2,1],[3,1]];
function mEq(num,den){if(num===0)return '';if(den===1)return num===1?'':num===-1?MINUS:fmtNeg(num);return '('+frac(num,den)+')';}
function eqStr(num,den,b){const m=mEq(num,den);if(num===0)return 'y = '+fmtNeg(b);return `y = ${m}x`+(b?S(b):'');}
function mountSI(el){
 let mi=11,b=-2,story=false;
 el.innerHTML=`<div class="ctrl"><label>slope <i class="v">m</i> <input type="range" id="ms" min="0" max="${MS.length-1}" value="${mi}"></label><label>y-intercept <i class="v">b</i> <input type="range" id="bs" min="-5" max="5" value="${b}"></label></div>
 <div class="eqline math" id="eqsi"></div><svg class="fig" style="max-width:480px"></svg><div class="readout"></div>
 <div class="row"><button data-q="ex">Example A: y = (3/4)x − 2</button><button data-q="taxi">🚕 Taxi: y = 2x + 3</button></div>`;
 const draw=()=>{const [num,den]=MS[mi];const g=story?grid({x0:0,x1:8,y0:0,y1:20,u:24,lab:2,xl:'miles',yl:'cost ($)'}):grid({u:32});
  const svg=$('svg',el);svg.setAttribute('viewBox',`0 0 ${g.W} ${g.H}`);
  let s=gline(g,num/den,b);let x=0,y=b;
  for(let k=0;k<3;k++){const ny=y+num,nx=x+den;if(nx>g.x1||ny>g.y1||ny<g.y0)break;
   if(num)s+=`<line x1="${g.X(x)}" y1="${g.Y(y)}" x2="${g.X(x)}" y2="${g.Y(ny)}" stroke="#7c3aed" stroke-width="4"/>`;
   s+=`<line x1="${g.X(x)}" y1="${g.Y(ny)}" x2="${g.X(nx)}" y2="${g.Y(ny)}" stroke="#059669" stroke-width="4"/>`+gdot(g,nx,ny,'#1f2937',5);x=nx;y=ny;}
  s+=gdot(g,0,b,'#ea580c',8,story?`start $${b}`:`(0, ${fmtNeg(b)})`);
  svg.innerHTML=g.base+s;
  $('#eqsi',el).innerHTML=`<i class="v">y</i> = <span style="color:#7c3aed;font-weight:700">${num===0?'0':mEq(num,den)||'1'}</span><i class="v">x</i> ${b<0?MINUS:'+'} <span class="k">${Math.abs(b)}</span>`;
  const mv=num===0?'flat — no rise':`${num>0?'up':'down'} ${Math.abs(num)}, right ${den}`;
  $('.readout',el).innerHTML=story?`<b>Taxi:</b> $3 just to get in (that’s <span class="k">b = 3</span>, the starting point). Each mile adds $2 (that’s <b style="color:#7c3aed">m = 2</b>: up 2 dollars, right 1 mile). A 6-mile ride costs 2(6) + 3 = <b>$15</b>.`:
   `<b>Step 1:</b> Start at the y-intercept <span class="k">(0, ${fmtNeg(b)})</span>.<br><b>Step 2:</b> Use the slope ${num===0?'0':frac(num,den)} = rise/run → <b style="color:#7c3aed">${num?(num>0?'up ':'down ')+Math.abs(num):'no rise'}</b>, <b style="color:#059669">right ${den}</b>.<br><b>Step 3:</b> Repeat, then connect the points with a line.`;
  $('#ms',el).value=mi;$('#bs',el).value=b;};
 $('#ms',el).addEventListener('input',e=>{mi=+e.target.value;story=false;draw();});
 $('#bs',el).addEventListener('input',e=>{b=+e.target.value;story=false;draw();});
 el.addEventListener('click',e=>{const q=e.target.closest('button')?.dataset.q;if(!q)return;if(q==='ex'){mi=11;b=-2;story=false;}else{mi=14;b=3;story=true;}draw();});
 draw();
}

  {q:'Which property justifies going from x ÷ 3 = 6 to x = 18?',o:['Addition Property of Equality','Division Property of Equality','Multiplication Property of Equality','Combining like terms'],a:2,why:'You multiplied both sides by 3 — the Multiplication Property of Equality.'},

L['1A-1-3']={
 goal:'I can create and interpret algebraic expressions to describe real-world scenarios.',
 life:{title:'Family day at an amusement park',html:'Adult tickets cost <b>$60</b> and child tickets cost <b>$30</b>. If <i class="v">a</i> adults and <i class="v">c</i> children go, the total cost is <span class="math">'+mx('60a + 30c')+'</span>.<br>Same idea with a phone plan: $25 a month + $10 per GB of extra data → <span class="math">'+mx('25 + 10g')+'</span>.'},
 see:[{title:'Every part of an expression has a meaning',hint:'Change the number of adults and children. Watch which part of the expression changes.',mount:mountTickets}],
 vocab:[['Expression','A math phrase with numbers, variables, and operations — no equal sign.'],['Term','A part of an expression separated by + or −. In 8p − 2q + 7 the terms are 8p, −2q, 7.'],['Coefficient','The number multiplying a variable (8 and −2 above). In a story it is often a rate: “$ per item”.'],['Constant','A term with no variable (7 above). In a story it is often a one-time fee or a starting amount.']],
 examples:[
  {title:'Example 1 — Write and use an expression',prob:'A gym charges a <b>$25</b> sign-up fee plus <b>$15 per month</b>. Write an expression for <i class="v">m</i> months. Then find the cost of 6 months.',lines:[
   ['15m','$15 for every month → coefficient 15 times the variable m.'],['15m + 25','Add the one-time $25 fee (a constant term).'],['15(6) + 25','Substitute m = 6.'],['90 + 25','Multiply first (order of operations).'],['115','Six months cost $115.']]},
  {title:'Example 2 — Name the parts',prob:'Identify the terms, coefficients, and constant of <span class="math">'+mx('8p − 2q + 7')+'</span>.',raw:true,lines:[
   ['Terms: 8<i class="v">p</i>, −2<i class="v">q</i>, +7','Terms are separated by + and − signs. Keep the sign with the term.'],['Coefficients: 8 and −2','The numbers multiplying the variables (the − sign belongs to 2).'],['Constant: 7','The term with no variable.']]}],
 mistake:{bad:'In 8p − 2q + 7, the coefficient of q is 2',good:'The coefficient of q is −2',why:'The sign in front of a term belongs to that term.'},
 practice(){
  const r=rand(2,12);let f=rand(3,25);if(f===r)f++;
  const C=pick([{t:`A bowling alley charges <b>$${r}</b> per game plus <b>$${f}</b> for shoe rental.`,v:'g',n:'games'},{t:`A rideshare charges a <b>$${f}</b> booking fee plus <b>$${r}</b> per mile.`,v:'d',n:'miles'},{t:`A school club sells T-shirts for <b>$${r}</b> each and already has <b>$${f}</b> in its account.`,v:'s',n:'shirts sold'},{t:`A phone plan costs <b>$${f}</b> a month plus <b>$${r}</b> for each GB of extra data.`,v:'x',n:'GB of extra data'}]);
  const v=C.v,ty=pick(['mc','eval','coef']);
  if(ty==='mc'){const m=mcFrom(mx(`${r}${v} + ${f}`),[mx(`${f}${v} + ${r}`),mx(`${r+f}${v}`),mx(`${r}(${v} + ${f})`)]);
   return {type:'mc',q:`${C.t} Let <i class="v">${v}</i> = number of ${C.n}. Which expression gives the total?`,opts:m.opts,a:m.a,why:`The rate $${r} multiplies ${v} (it changes with each one); the $${f} is added once.`};}
  if(ty==='eval'){const n=rand(2,9);return {q:`${C.t} Let <i class="v">${v}</i> = number of ${C.n}. The total is <span class="math">${mx(`${r}${v} + ${f}`)}</span>. What is the total when <i class="v">${v}</i> = ${n}?`,fields:[{label:'Total = $',answer:r*n+f}],hint:`Substitute ${v} = ${n}, multiply, then add.`,sol:[[`${r}(${n}) + ${f}`,`Substitute ${v} = ${n}.`],[`${r*n} + ${f}`,'Multiply first.'],[`${r*n+f}`,`The total is $${r*n+f}.`]]};}
  return {q:`${C.t} Let <i class="v">${v}</i> = number of ${C.n}. The total is <span class="math">${mx(`${r}${v} + ${f}`)}</span>. What is the <b>coefficient</b>?`,fields:[{label:'Coefficient =',answer:r}],hint:'The coefficient is the number multiplying the variable.',sol:[[`${r}${v}`,`${r} multiplies ${v}, so the coefficient is ${r}. It means $${r} for each one of the ${C.n}.`]]};},
 check:[
  {q:'In 8p − 2q + 7, what is the coefficient of q?',o:['2','−2','7','q'],a:1,why:'The minus sign belongs to the term: −2q.'},
  {q:'Pizzas cost $12 each plus a $5 delivery fee. Which expression gives the cost of n pizzas?',o:['5n + 12','17n','12n + 5','12(n + 5)'],a:2,why:'$12 for each pizza → 12n. The $5 fee is added once.'},
  {q:'In 60a + 30c (adult and child tickets), what does 30c represent?',o:['The number of children','The total cost for the children','The price of one adult ticket','The total cost for everyone'],a:1,why:'30 dollars × c children = the total cost for the children.'}]
};

L['1A-1-4']={
 goal:'I can write, solve, and interpret linear equations.',
 life:{title:'The plumber’s bill',html:'A plumber charges <b>$40</b> for a house call plus <b>$50 for each hour</b>. The bill was <b>$315</b>. How many hours did he work?<br>Many stories work the same way: <b>starting amount + rate × time = total</b> (savings, phone plans, taxi rides, gym memberships).'},
 see:[{title:'Build the bill with a bar model',hint:'Slide the hours until the bar reaches the red $315 line.',mount:mountBar}],
 vocab:[['Initial value','The starting amount — it doesn’t change (the $40 house call).'],['Rate of change','How much the total changes for each unit (the $50 per hour). It becomes the coefficient.'],['Total value','The final amount (the $315 bill). It goes on the other side of the equal sign.']],
 examples:[
  {title:'Example 1 — The 4-step method',prob:'Elijah has <b>$50</b>. He gets <b>$10 per week</b> for allowance. A new bike costs <b>$120</b>. How many weeks must he save?',lines:[
   ['50 + 10w = 120','Steps 1–2: Translate and write. Initial value 50 + rate 10w = total 120.'],['10w = 70','Step 3: Solve. Subtraction Property — subtract 50 from both sides.'],['w = 7','Division Property — divide both sides by 10.'],['w = 7','Step 4: Interpret. Elijah must save for 7 weeks. Check: 50 + 70 = 120 ✓']]},
  {title:'Example 2 — Distributive property',prob:'3 friends each buy a concert ticket plus a <b>$6</b> snack combo. Together they pay <b>$93</b>. How much is one ticket?',lines:[
   ['3(t + 6) = 93','Each friend pays (t + 6); there are 3 friends.'],['3t + 18 = 93','Distribute the 3 to both terms.'],['3t = 75','Subtract 18 from both sides.'],['t = 25','Divide both sides by 3. One ticket costs $25.']]},
  {title:'Example 3 — Variables on both sides',prob:'Gym A: <b>$40</b> sign-up + <b>$20</b>/month. Gym B: <b>$10</b> sign-up + <b>$30</b>/month. After how many months do they cost the same?',lines:[
   ['40 + 20m = 10 + 30m','Set the two costs equal.'],['40 = 10 + 10m','Subtract 20m from both sides — collect the variables on one side.'],['30 = 10m','Subtract 10 from both sides.'],['m = 3','Divide by 10. After 3 months both gyms cost $100.']]}],
 mistake:{bad:'Plumber: 50 + 40h = 315',good:'40 + 50h = 315',why:'The <b>rate</b> (what you pay each hour) multiplies the variable. The one-time fee stands alone.'},
 practice(){
  const k=pick(['plumber','save','taxi','share']);
  if(k==='share'){const n=rand(2,5),s=rand(3,8),t=rand(12,40),Tt=n*(t+s);
   return {q:`${n} friends each buy a concert ticket plus a <b>$${s}</b> snack combo. Together they pay <b>$${Tt}</b>. How much is one ticket?`,fields:[{label:'One ticket = $',answer:t}],hint:`Write ${n}(t + ${s}) = ${Tt}. Distribute first, or divide both sides by ${n}.`,sol:[[`${n}(t + ${s}) = ${Tt}`,'Each friend pays (t + snack).'],[`${n}t + ${n*s} = ${Tt}`,`Distribute the ${n}.`],[`${n}t = ${Tt-n*s}`,`Subtract ${n*s} from both sides.`],[`t = ${t}`,`Divide by ${n}. One ticket costs $${t}.`]]};}
  let S0,r,n,v,q,unit;
  if(k==='plumber'){S0=pick([35,40,45,50,60]);r=pick([40,45,50,60,65,75]);n=pick([2,2.5,3,3.5,4,4.5,5,6]);v='h';unit='hours';q=`A plumber charges <b>$${S0}</b> for a house call plus <b>$${r}</b> per hour. The bill was <b>$${S0+r*n}</b>. How many hours did the plumber work?`;}
  if(k==='save'){S0=rand(1,8)*10;r=pick([5,10,15,20,25]);n=rand(3,12);v='w';unit='weeks';q=`Maya has <b>$${S0}</b> saved. She adds <b>$${r}</b> each week. How many weeks until she has <b>$${S0+r*n}</b>?`;}
  if(k==='taxi'){S0=pick([2,3,4,5]);r=pick([2,3]);n=rand(3,15);v='m';unit='miles';q=`A taxi charges <b>$${S0}</b> to start plus <b>$${r}</b> per mile. The ride cost <b>$${S0+r*n}</b>. How many miles was the ride?`;}
  const Tt=S0+r*n;
  return {q,fields:[{label:`${v} =`,answer:n,unit}],hint:`Starting amount + rate × ${v} = total → ${S0} + ${r}${v} = ${Tt}.`,sol:[[`${S0} + ${r}${v} = ${Tt}`,'Initial value + rate of change = total.'],[`${r}${v} = ${Tt-S0}`,`Subtract ${S0} from both sides.`],[`${v} = ${fmtNeg(n)}`,`Divide both sides by ${r}. Answer: ${fmtNeg(n)} ${unit}.`]]};},
 check:[
  {q:'A taxi charges $3 plus $2 per mile. The ride cost $19. Which equation fits?',o:['2 + 3m = 19','3 + 2m = 19','5m = 19','3m + 2m = 19'],a:1,why:'Start $3 + $2 for each mile (2m) = $19 total.'},
  {q:'Solve 2(x + 4) = 18.',o:['x = 7','x = 5','x = 11','x = 9'],a:1,why:'2x + 8 = 18 → 2x = 10 → x = 5.'},
  {q:'In 50 + 10w = 120 (Elijah’s bike), what does 10 represent?',o:['The cost of the bike','The money he starts with','The money he saves each week','The number of weeks'],a:2,why:'10 is the rate of change: $10 added every week.'}]
};

L['1A-1-5']={
 goal:'I can solve formulas for a particular variable of interest.',
 life:{title:'Planning a road trip',html:'A road trip is <b>270 miles</b> and you’ll drive about <b>60 mph</b>. How long will it take? The formula <span class="math">'+mx('d = rt')+'</span> (distance = rate × time) is solved for <i class="v">d</i>, but you need <i class="v">t</i>.<br>Rearranging the formula once lets you answer every “how long?” question fast.'},
 see:[{title:'The d-r-t triangle',hint:'Tap what you want to find. Cover it, and the triangle shows what to do with the others.',mount:mountTriangle},{title:'Undo in reverse order',hint:'Solving a formula for a variable means undoing what was done to it — last thing first.',mount:el=>el.innerHTML=undoMachine()}],
 vocab:[['Literal equation','An equation with several variables, like a formula (V = lwh).'],['Solve for a variable','Get that variable alone on one side.'],['Inverse operations','Operations that undo each other: + and −, × and ÷.']],
 examples:[
  {title:'Example 1',prob:'Solve <span class="math">'+mx('A = ½bh')+'</span> for <i class="v">h</i>. Then find the height of a triangular sail with area 30 ft² and base 6 ft.',lines:[
   ['A = ½bh','Original formula.'],['2A = bh','Multiplication Property: multiply both sides by 2 to undo ½.'],['2A ÷ b = h','Division Property: divide both sides by b.'],['h = 2A ÷ b','Solved for h.'],['h = 2(30) ÷ 6 = 10','Substitute: the sail is 10 ft tall.']]},
  {title:'Example 2 — Two-variable equation',prob:'Solve <span class="math">'+mx('2x + 3y = 12')+'</span> for <i class="v">y</i>.',lines:[
   ['2x + 3y = 12','Original equation.'],['3y = 12 − 2x','Subtraction Property: subtract 2x from both sides.'],['y = (12 − 2x) ÷ 3','Division Property: divide both sides by 3.'],['y = −(2/3)x + 4','Simplify. (You’ll use this form again in slope-intercept form!)']]}],
 mistake:{bad:'d = rt → t = d − r',good:'d = rt → t = d ÷ r',why:'r is <b>multiplied</b> by t, so undo it by <b>dividing</b>.'},
 practice(){
  if(Math.random()<.5){const F=pick([['d = rt','t','t = d/r',['t = dr','t = r/d','t = d − r']],['V = lwh','w','w = V/(lh)',['w = Vlh','w = lh/V','w = V − lh']],['P = 2l + 2w','l','l = (P − 2w)/2',['l = P − 2w','l = P/2 − 2w','l = (P + 2w)/2']],['A = ½bh','h','h = 2A/b',['h = A/(2b)','h = 2Ab','h = A − ½b']],['C = 2πr','r','r = C/(2π)',['r = 2πC','r = C − 2π','r = 2π/C']],['I = Prt','r','r = I/(Pt)',['r = IPt','r = Pt/I','r = I − Pt']],['y = mx + b','x','x = (y − b)/m',['x = y/m − b','x = (y + b)/m','x = m(y − b)']],['F = 1.8C + 32','C','C = (F − 32)/1.8',['C = F/1.8 − 32','C = 1.8(F − 32)','C = (F + 32)/1.8']]]);
   const m=mcFrom(mx(F[2]),F[3].map(mx));return {type:'mc',q:`Solve <span class="math">${mx(F[0])}</span> for <i class="v">${F[1]}</i>.`,opts:m.opts,a:m.a,why:`Undo each operation on ${F[1]} with its inverse, in reverse order: ${F[2]}.`};}
  const k=pick(['trip','temp','garden']);
  if(k==='trip'){const r=pick([50,55,60,65,70]),t=pick([2,2.5,3,4,4.5,5]),d=r*t;return {q:`A road trip is <b>${d} miles</b>. You drive at an average of <b>${r} mph</b>. Use <span class="math">${mx('d = rt')}</span>. How many hours will it take?`,fields:[{label:'t =',answer:t,unit:'hours'}],hint:'Solve for t first: t = d ÷ r.',sol:[['t = d ÷ r','Divide both sides of d = rt by r.'],[`t = ${d} ÷ ${r}`,'Substitute.'],[`t = ${t}`,`${t} hours.`]]};}
  if(k==='temp'){const C=pick([-10,-5,0,5,10,15,20,25,30,35,40]),F=Math.round(1.8*C+32);return {q:`The weather app shows <b>${F}°F</b>. Use <span class="math">${mx('F = 1.8C + 32')}</span>. What is the temperature in °C?`,fields:[{label:'C =',answer:C,unit:'°C'}],hint:'Undo + 32 first, then undo × 1.8.',sol:[['F − 32 = 1.8C','Subtract 32 from both sides.'],['C = (F − 32) ÷ 1.8','Divide both sides by 1.8.'],[`C = (${F} − 32) ÷ 1.8 = ${fmtNeg(C)}`,'Substitute and compute.']]};}
  const w=rand(3,12),l=rand(5,20);return {q:`A rectangular garden has an area of <b>${l*w} ft²</b> and a length of <b>${l} ft</b>. Use <span class="math">${mx('A = lw')}</span>. How wide is it?`,fields:[{label:'w =',answer:w,unit:'ft'}],hint:'Solve for w: w = A ÷ l.',sol:[['w = A ÷ l','Divide both sides by l.'],[`w = ${l*w} ÷ ${l} = ${w}`,`The garden is ${w} ft wide.`]]};},
 check:[
  {q:'Solve P = mgh for m.',o:['m = Pgh','m = P/(gh)','m = gh/P','m = P − gh'],a:1,why:'m is multiplied by g and h, so divide both sides by gh.'},
  {q:'Solve y − 3 = 2x for x.',o:['x = (y − 3)/2','x = 2(y − 3)','x = y/2 − 3','x = (y + 3)/2'],a:0,why:'Divide both sides by 2: x = (y − 3) ÷ 2.'},
  {q:'You drive 150 miles at 50 mph. Using t = d ÷ r, how long does it take?',o:['7,500 hours','100 hours','3 hours','0.33 hours'],a:2,why:'t = 150 ÷ 50 = 3 hours.'}]
};

L['1A-2-3']={
 goal:'I can calculate and interpret the average rate of change from an equation, a table, or a graph.',
 life:{title:'Ramps and paychecks',html:'<svg viewBox="0 0 520 120" class="fig" style="max-width:520px"><path d="M30 95 L430 95 L430 62Z" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2.5"/><line x1="30" y1="105" x2="430" y2="105" stroke="#059669" stroke-width="3"/><text x="230" y="120" text-anchor="middle" font-size="14" font-weight="800" fill="#059669">run = 12 ft</text><line x1="442" y1="62" x2="442" y2="95" stroke="#7c3aed" stroke-width="3"/><text x="450" y="84" font-size="14" font-weight="800" fill="#7c3aed">rise = 1 ft</text><circle cx="140" cy="78" r="9" fill="#374151"/><text x="140" y="40" font-size="14" text-anchor="middle" fill="#374151">wheelchair ramp: slope = 1/12</text></svg>A wheelchair ramp may rise at most <b>1 foot for every 12 feet</b> of length — that’s a slope of 1/12. Too steep is dangerous.<br>A job that pays <b>$15 per hour</b> has a rate of change of 15: every extra hour adds $15.'},
 see:[{title:'Slope = rise ÷ run',hint:'Drag points A and B anywhere. The purple arrow is the rise; the green arrow is the run.',mount:mountSlope}],
 vocab:[['Slope (m)','A number that tells the steepness and direction of a line: rise ÷ run.'],['Rise','The vertical change (change in y). Up is +, down is −.'],['Run','The horizontal change (change in x). Read left to right.'],['Rate of change','Slope in a real situation: change in output ÷ change in input ($ per hour, miles per gallon).']],
 examples:[
  {title:'Example 1 — From two points',prob:'Find the slope of the line through (1, 2) and (5, 8).',lines:[
   ['m = (y₂ − y₁) ÷ (x₂ − x₁)','Slope formula: change in y over change in x.'],['m = (8 − 2) ÷ (5 − 1)','Substitute (x₁, y₁) = (1, 2) and (x₂, y₂) = (5, 8).'],['m = 6 ÷ 4','Rise 6, run 4.'],['m = 3/2','Simplify. Positive: the line goes up from left to right.']]},
  {title:'Example 2 — From a table',prob:'<table class="t"><tr><th>Hours worked</th><td>2</td><td>5</td></tr><tr><th>Pay ($)</th><td>30</td><td>75</td></tr></table>Find and interpret the rate of change.',raw:true,lines:[
   ['(75 − 30) ÷ (5 − 2)','Change in pay ÷ change in hours.'],['= 45 ÷ 3','Subtract.'],['= 15','Divide.'],['$15 per hour','Interpret: each extra hour of work adds $15.']]}],
 mistake:{bad:'m = (5 − 1) ÷ (8 − 2)',good:'m = (8 − 2) ÷ (5 − 1)',why:'Slope is <b>y</b> change on top, <b>x</b> change on the bottom — “rise over run”.'},
 practice(){
  if(Math.random()<.65){let x1,y1,x2,y2;do{x1=rand(-5,5);y1=rand(-5,5);x2=rand(-5,5);y2=rand(-5,5);}while(x1===x2||(Math.abs(x2-x1)<2&&Math.abs(y2-y1)<2));
   const g=grid({u:24});const m=(y2-y1)/(x2-x1);
   const fig=g.svg(gline(g,m,y1-m*x1)+gdot(g,x1,y1,'#ea580c',7,`(${fmtNeg(x1)}, ${fmtNeg(y1)})`)+gdot(g,x2,y2,'#1f2937',7,`(${fmtNeg(x2)}, ${fmtNeg(y2)})`));
   return {q:`Find the slope of the line through <b>(${fmtNeg(x1)}, ${fmtNeg(y1)})</b> and <b>(${fmtNeg(x2)}, ${fmtNeg(y2)})</b>. <span class="mute">Fractions like −3/4 are OK.</span>`,fig,fields:[{label:'m =',answer:m}],hint:'Count the rise (up/down) and the run (right) between the points, or use (y₂ − y₁) ÷ (x₂ − x₁).',
    sol:[[`m = (${fmtNeg(y2)} − ${P(y1)}) ÷ (${fmtNeg(x2)} − ${P(x1)})`,'Substitute into the slope formula.'],[`m = ${fmtNeg(y2-y1)} ÷ ${fmtNeg(x2-x1)}`,'Subtract.'],[`m = ${frac(y2-y1,x2-x1)}`,'Simplify.']],raw:true};}
  const k=pick(['pay','tank','phone']);
  if(k==='pay'){const r=pick([12,14,15,16,18,20]),a=rand(1,4),b=a+rand(2,5);return {q:`<table class="t"><tr><th>Hours worked</th><td>${a}</td><td>${b}</td></tr><tr><th>Pay ($)</th><td>${a*r}</td><td>${b*r}</td></tr></table>What is the rate of change (dollars per hour)?`,fields:[{label:'Rate =',answer:r,unit:'$ per hour'}],raw:true,hint:'Change in pay ÷ change in hours.',sol:[[`(${b*r} − ${a*r}) ÷ (${b} − ${a})`,'Change in pay ÷ change in hours.'],[`${(b-a)*r} ÷ ${b-a} = ${r}`,`$${r} per hour.`]]};}
  if(k==='tank'){const r=pick([2,3,4,5,6]),s=rand(60,90),a=rand(1,4),b=a+rand(3,6);return {q:`A water tank is draining. <table class="t"><tr><th>Minutes</th><td>${a}</td><td>${b}</td></tr><tr><th>Liters left</th><td>${s-a*r}</td><td>${s-b*r}</td></tr></table>What is the rate of change (liters per minute)?`,fields:[{label:'Rate =',answer:-r,unit:'L per minute'}],raw:true,hint:'The amount is going DOWN, so the rate is negative.',sol:[[`(${s-b*r} − ${s-a*r}) ÷ (${b} − ${a})`,'Change in liters ÷ change in minutes.'],[`${fmtNeg(-(b-a)*r)} ÷ ${b-a} = ${fmtNeg(-r)}`,`The tank loses ${r} liters each minute.`]]};}
  const r=pick([2,4,5,8,10]),a=rand(1,3),b=a+rand(2,4);return {q:`Your phone battery while gaming: <table class="t"><tr><th>Hours</th><td>${a}</td><td>${b}</td></tr><tr><th>Battery (%)</th><td>${100-a*r*2}</td><td>${100-b*r*2}</td></tr></table>What is the rate of change (% per hour)?`,fields:[{label:'Rate =',answer:-2*r,unit:'% per hour'}],raw:true,hint:'Change in battery ÷ change in hours. Going down → negative.',sol:[[`(${100-b*r*2} − ${100-a*r*2}) ÷ (${b} − ${a})`,'Change in % ÷ change in hours.'],[`${fmtNeg(-(b-a)*r*2)} ÷ ${b-a} = ${fmtNeg(-2*r)}`,`The battery drops ${2*r}% each hour.`]]};},
 check:[
  {q:'A line slants DOWN as you read from left to right. Its slope is…',o:['positive','negative','zero','undefined'],a:1,why:'Going down from left to right means a negative rise for a positive run.'},
  {q:'What is the slope of the line through (1, 2) and (3, 8)?',o:['1/3','6','3','4'],a:2,why:'(8 − 2) ÷ (3 − 1) = 6 ÷ 2 = 3.'},
  {q:'What is the slope of a vertical line?',o:['0','1','undefined','infinite and positive'],a:2,why:'The run is 0, and you can’t divide by 0.'}]
};

L['1A-2-4']={
 goal:'I can graph linear equations written in slope-intercept form, y = mx + b.',
 life:{title:'A taxi ride',html:'A taxi charges <b>$3</b> as soon as you get in, plus <b>$2 per mile</b>. Cost: <span class="math">'+mx('y = 2x + 3')+'</span>.<br>The <span class="k">$3</span> is where the graph <b>starts</b> (the y-intercept, b). The <b style="color:#7c3aed">$2 per mile</b> is how steeply it <b>climbs</b> (the slope, m). Tap the 🚕 button below to see it.'},
 see:[{title:'Start at b, then step with m',hint:'Move the sliders. Orange dot = y-intercept. Purple = rise, green = run.',mount:mountSI}],
 vocab:[['Slope-intercept form','y = mx + b'],['m (slope)','The rise over run — how the line moves for each step.'],['b (y-intercept)','Where the line crosses the y-axis: the point (0, b). In a story, the starting amount.']],
 examples:[
  {title:'Example A — Graph y = (3/4)x − 2',prob:'Graph <span class="math">'+mx('y = (3/4)x − 2')+'</span> using the slope and the y-intercept.',lines:[
   ['m = 3/4, b = −2','Step 1: Identify the slope and the y-intercept.'],['(0, −2)','Step 2: Plot the y-intercept first.'],['(0, −2) → (4, 1)','Step 3: Use the slope: up 3, right 4. Plot the new point.'],['y = (3/4)x − 2','Step 4: Connect the points with a straight line.']]},
  {title:'Example B — Rewrite first',prob:'Graph <span class="math">'+mx('x + 3y = 6')+'</span>.',lines:[

function mountSlopeExplorer(){
 const root=$('#slope-lab');if(!root)return;

   if(v!==0)g+='<text x="'+X(v)+'" y="'+(B+17)+'" text-anchor="middle" font-size="10" fill="#64748b">'+v+'</text><text x="'+(L-10)+'" y="'+(Y(v)+3)+'" text-anchor="end" font-size="10" fill="#64748b">'+v+'</text>';
  }

  if(m!==0){
   const xa=-Math.min(2,Math.max(-2,Math.floor((5-b)/m))),xb=xa+1,ya=m*xa+b,yb=m*xb+b;
   if(ya>=-5&&ya<=5&&yb>=-5&&yb<=5)g+='<path d="M'+X(xa)+' '+Y(ya)+' L'+X(xb)+' '+Y(ya)+' L'+X(xb)+' '+Y(yb)+'" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="5 4"/><circle cx="'+X(xb)+'" cy="'+Y(yb)+'" r="4" fill="#ea580c"/>';
  }

function mountAlgebraTiles(){
 const root=$('#tiles-lab');if(!root)return;
 let xp=2,xn=0,up=3,un=0;
 const row=$('#tile-row',root),expr=$('#tile-expression',root),feedback=$('#tile-feedback',root);
 function draw(){
  const tiles=[];
  for(let i=0;i<Math.min(xp,8);i++)tiles.push('<span class="alg-tile xpos" aria-label="positive x tile">x</span>');
  for(let i=0;i<Math.min(xn,8);i++)tiles.push('<span class="alg-tile xneg" aria-label="negative x tile">−x</span>');
  for(let i=0;i<Math.min(up,12);i++)tiles.push('<span class="alg-tile onepos" aria-label="positive one tile">+1</span>');
  for(let i=0;i<Math.min(un,12);i++)tiles.push('<span class="alg-tile oneneg" aria-label="negative one tile">−1</span>');
  row.innerHTML=tiles.join('')||'<span class="mute">No tiles yet. Add a tile to begin.</span>';
  const x=xp-xn,c=up-un;
  const xPart=x===0?'':x===1?'x':x===-1?'−x':x<0?'− '+Math.abs(x)+'x':x+'x';
  const cPart=c===0?'':c<0?'− '+Math.abs(c):xPart?'+ '+c:String(c);
  expr.textContent=(xPart+(xPart&&cPart?' ':'')+cPart)||'0';
  const pairs=Math.min(xp,xn)+Math.min(up,un);
  feedback.textContent=pairs?t('You have {0} zero pair(s). A positive and a negative tile cancel to make 0.',pairs):t('Combine like tiles: x-tiles with x-tiles, and unit tiles with unit tiles.');
  $('#tile-count',root).textContent=t('{0} x-tile(s) · {1} unit tile(s)',xp+xn,up+un);
 }
 root.addEventListener('click',e=>{
  const b=e.target.closest('button[data-tile]');if(!b)return;
  const a=b.dataset.tile;
  if(a==='xp'&&xp<8)xp++;if(a==='xn'&&xn<8)xn++;if(a==='up'&&up<12)up++;if(a==='un'&&un<12)un++;
  if(a==='cancel'){const k=Math.min(xp,xn);xp-=k;xn-=k;const q=Math.min(up,un);up-=q;un-=q;}
  if(a==='reset'){xp=2;xn=0;up=3;un=0;}
  draw();
 });
 draw();
}
function mountBalanceLab(){

  {l:'2x',r:'8',msg:t('Subtract 3 from BOTH sides. The balance stays level: 2x + 3 − 3 = 11 − 3, so 2x = 8.')},

 ];

 }

  if(stage===2)stage=0;else stage++;
  draw();
 });

}

 const drawQ=()=>{const q=questions[qIndex];$('#diag-q').textContent=q.q;$('#diag-options').innerHTML=q.opts.map((o,i)=>`<button type="button" data-answer="${i}">${o}</button>`).join('');$('#diag-feedback').textContent='';$('#diag-count').textContent=t('Question {0} of 3 · Score {1}',qIndex+1,score);$('#diag-next').disabled=true;$('#diag-next').textContent=qIndex===2?t('See results')+' →':t('Next question')+' →';answered=false;};
 $('#unit-diagnostic').addEventListener('click',e=>{const b=e.target.closest('[data-answer]');if(!b||answered)return;answered=true;const q=questions[qIndex],correct=+b.dataset.answer===q.a;if(correct)score++;$$('[data-answer]',$('#diag-options')).forEach((x,i)=>{x.disabled=true;if(i===q.a)x.style.borderColor='#0f766e';if(i===+b.dataset.answer&&!correct)x.style.borderColor='#b91c1c';});$('#diag-feedback').innerHTML=(correct?`<span class="good">${t('Correct!')} </span>`:`<span class="bad">${t('Not quite.')} </span>`)+q.why;$('#diag-count').textContent=t('Question {0} of 3 · Score {1}',qIndex+1,score);$('#diag-next').disabled=false;});
 $('#diag-next').addEventListener('click',()=>{if(!answered)return;if(qIndex<2){qIndex++;drawQ();}else{$('#unit-diagnostic').innerHTML=`<b>${t('Starting point:')} ${score}/3</b><p>${score===3?t('You are ready to begin Unit 4.'):t('Review the explanations above, then begin with Lesson 1. You can revisit this check anytime.')}</p><a class="btn primary" href="#/l/KA-4-1/0">${t('Start Lesson 1')} →</a>`;}});drawQ();
}
function renderLesson(id,stage){
 const M=META[id],D=L[id],pr=prog(id);document.documentElement.style.setProperty('--acc','#1865f2');
 const nx=nextLesson(id);
 app.innerHTML=`<div class="wrap"><a href="${unitHref(M.cat,unitIndexOf(id))}">← ${t(M.u+' {0}',M.m)}: ${mt(M.c+'-'+M.m,M.mt)}</a><div class="crumb">${t(M.lab)} · ${t(M.u+' {0}',M.m)}: ${mt(M.c+'-'+M.m,M.mt)} · ${t('Lesson {0}',M.n)}</div><h1>${lt(id)}${ZHON()?`<span class="h1en">${M.title}</span>`:''}</h1><div class="goal">🎯 ${D.goal}</div>
 <nav class="stepper">${STAGES.map((s,i)=>`<a class="pill ${i===stage?'on':''} ${pr[s.k]?'done':''}" data-k="${s.k}" href="#/l/${id}/${i}"><span class="ic">${s.i} </span>${t(s.n)}</a>`).join('')}</nav>
 <section id="stage"></section>
 <div class="navrow">${stage>0?`<a class="btn" href="#/l/${id}/${stage-1}">◀ ${t(STAGES[stage-1].n)}</a>`:'<span></span>'}${stage<3?`<a class="btn primary" href="#/l/${id}/${stage+1}">${t('Next: {0} ▶',t(STAGES[stage+1].n))}</a>`:(nx?`<a class="btn" href="#/l/${nx}/0">${t('Next lesson ▶')}</a>`:`<a class="btn" href="${unitHref(M.cat,unitIndexOf(id))}">${t('All lessons')}</a>`)}</div></div>`;
 const el=$('#stage');[stPicture,stSteps,stPencil,stCheck][stage](el,id,D,pr);
}
function markStage(id,k){const pr=prog(id);if(!pr[k]){pr[k]=true;save();}const p=$(`.pill[data-k="${k}"]`);if(p)p.classList.add('done');}

function stPicture(el,id,D){
 el.innerHTML=`<div class="card life"><div class="tag">${t('Real life')}</div><h3>${D.life.title}</h3><div>${D.life.html}</div></div>
 ${D.see.map((s,i)=>`<div class="card"><div class="tag">${t('See it')}</div><h3>${s.title}</h3><p class="mute" style="margin-top:0">${s.hint}</p><div id="see${i}"></div></div>`).join('')}
 <div class="card"><div class="tag">${t('Key words')}</div><dl class="vocab">${vocabHTML(id,D.vocab)}</dl></div>`;
 D.see.forEach((s,i)=>s.mount($('#see'+i)));markStage(id,'pic');
}
function lineHTML(l,raw,hide){return `<div class="ln-step ${hide?'hide':''}"><div class="m math">${raw||l[2]?l[0]:mx(l[0])}</div><div class="why">${l[1]}</div></div>`;}
function stSteps(el,id,D){
 el.innerHTML=D.examples.map((e,i)=>`<div class="card ex" data-i="${i}"><div class="tag">${e.title}</div><div class="prob">${e.prob}</div><div class="lines">${e.lines.map((l,j)=>lineHTML(l,e.raw,j>0)).join('')}</div>
 <div class="row"><button class="primary" data-a="next">${t('Next step ▼')}</button><button data-a="all">${t('Show all')}</button></div></div>`).join('')+
 `<div class="card mistake"><div class="tag">${t('⚠ Common mistake')}</div><div class="mk"><div class="x"><span class="bad">✗</span> <span class="math">${D.mistake.bad}</span></div><div class="o"><span class="good">✓</span> <span class="math">${D.mistake.good}</span></div></div><p style="margin-bottom:0">${D.mistake.why}</p></div>`;
 const chk=()=>{if(!$$('.ln-step.hide',el).length)markStage(id,'steps');};
 el.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const card=b.closest('.ex');const hidden=$$('.ln-step.hide',card);
  if(b.dataset.a==='next'&&hidden.length)hidden[0].classList.remove('hide');if(b.dataset.a==='all')hidden.forEach(h=>h.classList.remove('hide'));
  if(!$$('.ln-step.hide',card).length){$('[data-a=next]',card).disabled=true;$('[data-a=all]',card).disabled=true;}chk();});
}
function stPencil(el,id,D,pr){
 let p,counted,shown;
 const status=()=>t('Correct answers: <b>{0}</b> · ',pr.pc||0)+(pr.pencil?`<span class="good">${t('✓ Pencil step complete')}</span>${t(' — keep practicing or move on to Check.')}`:t('Get 2 correct to complete this step.'));
 const fresh=()=>{p=D.practice();counted=false;shown=false;draw();};
 const draw=()=>{el.innerHTML=`<div class="card"><div class="tag">${t('Your turn')}</div><div class="pencilnote">✏️ ${t('<b>Pencil first:</b> work it out on paper — write each step and why. Then enter your answer.')}</div>
  <div class="prob">${p.q}</div>${p.fig||''}
  <div style="margin-top:8px">${p.type==='mc'?p.opts.map((o,i)=>`<button class="opt" data-o="${i}">${o}</button>`).join(''):p.fields.map((f,i)=>`<label class="fld">${f.label} <input data-f="${i}" autocomplete="off" inputmode="decimal"> ${f.unit||''}</label>`).join('')}</div>
  <div class="row">${p.type==='mc'?'':`<button class="primary" data-a="check">${t('btnCheck')}</button>`}${p.hint?`<button data-a="hint">${t('💡 Hint')}</button>`:''}${p.sol?`<button data-a="sol">${t('Show solution')}</button>`:''}<button data-a="new">${t('New problem ↻')}</button></div>
  <div class="fb"></div>${p.sol?`<div class="solbox" hidden>${p.sol.map(l=>lineHTML(l,p.raw,false)).join('')}</div>`:''}<div class="streak">${status()}</div></div>`;
  const inp=$('input',el);if(inp)inp.focus({preventScroll:true});};
 const win=()=>{if(!counted&&!shown){counted=true;pr.pc=(pr.pc||0)+1;save();if(pr.pc>=2)markStage(id,'pencil');}$('.streak',el).innerHTML=status();};
 el.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const fb=$('.fb',el);
  if(b.dataset.o!==undefined){const i=+b.dataset.o;if(i===p.a){b.classList.add('right');fb.className='fb okk';fb.innerHTML=t('✓ Correct! ')+(p.why||'');$$('.opt',el).forEach(x=>x.disabled=true);win();}else{b.classList.add('wrong');b.disabled=true;fb.className='fb no';fb.textContent=t('Not quite — look at the picture again and try another choice.');}return;}
  const a=b.dataset.a;
  if(a==='new')fresh();
  if(a==='hint'){fb.className='fb';fb.innerHTML='💡 '+p.hint;}
  if(a==='sol'){shown=true;$('.solbox',el).hidden=false;}
  if(a==='check'){const res=p.fields.map((f,i)=>{const v=parseAns($(`[data-f="${i}"]`,el).value);return !isNaN(v)&&Math.abs(v-f.answer)<=(f.tol||0.011);});
   const blank=p.fields.some((f,i)=>!$(`[data-f="${i}"]`,el).value.trim());
   if(blank){fb.className='fb no';fb.textContent=t('Enter an answer in every box first.');return;}
   p.fields.forEach((f,i)=>$(`[data-f="${i}"]`,el).style.borderColor=res[i]?'#15803d':'#b91c1c');
   if(res.every(Boolean)){fb.className='fb okk';fb.innerHTML=t('✓ Correct! Nice pencil work. Try another one with “New problem”.');win();}
   else{fb.className='fb no';fb.textContent=t('Not yet. Check your work step by step, or tap 💡 Hint.');}}});
 el.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('input')){const c=$('[data-a=check]',el);if(c)c.click();}});
 fresh();
}
function stCheck(el,id,D,pr){
 const sel=[];
 const draw=()=>{el.innerHTML=`<div class="card"><div class="tag">${t('Quick check')}</div><p class="mute" style="margin-top:0">${t('Answer all 3. Get at least 2 right to complete the lesson.')}</p>
  ${D.check.map((c,i)=>`<div class="qq" data-q="${i}"><b>${i+1}. ${c.q}</b>${c.o.map((o,j)=>`<button class="opt" data-q="${i}" data-j="${j}">${String.fromCharCode(65+j)}. ${o}</button>`).join('')}<div class="why">${c.why}</div></div>`).join('')}
  <div class="row"><button class="primary" data-a="submit">${t('Submit')}</button></div><div id="res"></div></div>`;};
 draw();
 el.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.j!==undefined){const q=+b.dataset.q;if(el.dataset.locked)return;sel[q]=+b.dataset.j;$$(`.opt[data-q="${q}"]`,el).forEach(x=>x.classList.toggle('sel',+x.dataset.j===sel[q]));return;}
  if(b.dataset.a==='submit'){if(D.check.some((c,i)=>sel[i]===undefined)){$('#res',el).innerHTML=`<p class="bad">${t('Answer all 3 questions first.')}</p>`;return;}
   el.dataset.locked=1;let score=0;
   D.check.forEach((c,i)=>{const ok=sel[i]===c.a;if(ok)score++;$(`.qq[data-q="${i}"]`,el).classList.add('shown');$$(`.opt[data-q="${i}"]`,el).forEach(x=>{const j=+x.dataset.j;x.classList.remove('sel');if(j===c.a)x.classList.add('right');else if(j===sel[i])x.classList.add('wrong');x.disabled=true;});});
   b.disabled=true;
   if(score>=2){pr.check=score;pr.done=true;save();markStage(id,'check');topProg();const nx=nextLesson(id);
    $('#res',el).innerHTML=`<div class="done-banner">🎉 ${t('{0}/3 — Lesson complete!',score)}${nx?` <a class="btn primary" href="#/l/${nx}/0" style="margin-left:8px">${t('Next lesson: {0} ▶',lt(nx))}</a>`:''}</div>`;}
   else $('#res',el).innerHTML=`<p class="bad">${t('{0}/3. Read the explanations, review the Steps, then try again.',score)}</p><div class="row"><a class="btn" href="#/l/${id}/1">${t('◀ Review Steps')}</a><button data-a="retry">${t('Try again')}</button></div>`;}
  if(b.dataset.a==='retry'){delete el.dataset.locked;sel.length=0;draw();}});
}

function route(){const h=location.hash.replace(/^#\/?/,'').split('/');
 if(h[0]==='u'&&h[1]==='linear-equations-graphs'){location.replace('#/c/ka/u/4');return;}
 /* L4L tab removed: send old Algebra 1A/1B links to the matching Algebra 1 lesson, or to the course page */
 if(h[0]==='l'&&META[h[1]]&&META[h[1]].cat==='alg1'){const k=Object.keys(KA_ALIAS).find(a=>KA_ALIAS[a]===h[1]);if(k){location.replace(`#/l/${k}/${h[2]||0}`);return;}}
 if(h[0]==='c'&&h[1]==='alg1'){location.replace('#/c/ka');return;}
 if(h[0]==='l'&&META[h[1]])CUR=META[h[1]].cat;else if(h[0]==='c'&&CATS.some(c=>c.k===h[1]))CUR=h[1];
 if(h[0]==='l'&&hasLesson(h[1])){const s=Math.max(0,Math.min(3,+h[2]||0));if(L[h[1]])renderLesson(h[1],s);else{app.innerHTML=`<div class="wrap"><p class="mute">${t('Loading lesson…')}</p></div>`;ensureLesson(h[1]).then(()=>{if(L[h[1]])renderLesson(h[1],s);else renderHome();topProg();}).catch(()=>{app.innerHTML=`<div class="wrap"><p class="bad">${t('Could not load this lesson. Check your internet connection and refresh.')}</p></div>`;});}}else{document.documentElement.style.setProperty('--acc','#1865f2');renderHome(h[0]==='c'&&h[2]==='u'?(+h[3]||1)-1:undefined);}
 topProg();window.scrollTo(0,0);}
window.addEventListener('hashchange',route);applyChrome();route();
</script>

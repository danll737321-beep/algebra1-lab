<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Algebra 1 Visual Lab</title>
<style>
:root{--ink:#1f2937;--mute:#6b7280;--line:#e5e7eb;--bg:#f6f5f1;--x:#2563eb;--k:#ea580c;--ok:#15803d;--bad:#b91c1c;--rise:#7c3aed;--run:#059669;--acc:#2563eb}
*{box-sizing:border-box}
body{margin:0;font:17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
a{color:var(--acc)}
header.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px}
.brand{font-weight:800;font-size:18px;text-decoration:none;color:var(--ink)}
.brand span{color:var(--acc)}
.topprog{font-size:14px;color:var(--mute)}
.wrap{max-width:900px;margin:0 auto;padding:12px 16px 60px}
h1{font-size:28px;line-height:1.25;margin:6px 0}
h2{font-size:22px;margin:28px 0 8px}
h3{font-size:19px;margin:4px 0 8px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0}
.tag{display:inline-block;font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--acc);margin-bottom:4px}
.mute{color:var(--mute)}
.math{font-family:"Cambria Math","STIX Two Math","Times New Roman",Georgia,serif;font-size:1.2em}
.big{font-size:1.5em}
i.v{color:var(--x);font-style:italic;font-weight:600}
.k{color:var(--k);font-weight:700}
.bad{color:var(--bad);font-weight:700}
.good{color:var(--ok);font-weight:700}
button,.btn{font:inherit;font-size:16px;cursor:pointer;border-radius:10px;border:1px solid #d1d5db;background:#fff;color:var(--ink);padding:9px 14px;min-height:44px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
button:hover,.btn:hover{border-color:var(--acc)}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary,.btn.primary{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
svg.fig{width:100%;height:auto;display:block;margin:6px auto}
.gl{stroke:#e5e7eb;stroke-width:1}.ax{stroke:#6b7280;stroke-width:1.6}.tl{font-size:12px;fill:#6b7280}
.ln{stroke:var(--x);stroke-width:3}
.touch{touch-action:none}
/* home */
.hero{background:linear-gradient(135deg,#eff6ff,#fff7ed)}
.flow{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 14px}
.flow span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:600;font-size:15px}
.bar{height:10px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:14px 0 4px}
.bar i{display:block;height:100%;background:var(--ok)}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.mod{background:#fff;border:1px solid var(--line);border-top:6px solid var(--mc);border-radius:14px;padding:14px}
.mod .mn{font-size:13px;font-weight:700;color:var(--mc);text-transform:uppercase;letter-spacing:.05em}
.mod b{display:block;font-size:18px;margin-bottom:6px}
.mod ol{list-style:none;padding:0;margin:0}
.mod li{padding:5px 0;border-top:1px solid #f3f4f6;font-size:15.5px}
.mod li a{display:flex;gap:8px;text-decoration:none;color:var(--ink);font-weight:600}
.mod li a:hover{color:var(--acc)}
.mod li.soon{color:#9ca3af;display:flex;gap:8px}
.mod li small{margin-left:auto;font-size:12px}
.st{width:20px;flex:none;text-align:center}
.st.d{color:var(--ok);font-weight:800}
/* lesson */
.crumb{font-size:14px;color:var(--mute);margin-top:8px}
.goal{background:#fff;border-left:5px solid var(--ok);padding:8px 12px;border-radius:8px;margin:8px 0 12px}
.stepper{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;position:sticky;top:57px;z-index:4;background:var(--bg);padding:6px 0}
.pill{white-space:nowrap;text-align:center;padding:9px 4px;border-radius:999px;border:1px solid #d1d5db;background:#fff;font-weight:700;font-size:15px;text-decoration:none;color:var(--ink)}
.pill.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.pill.done:not(.on){border-color:var(--ok);color:var(--ok)}
.pill.done::after{content:" ✓"}
.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.life{border-left:6px solid var(--k)}
.life .tag{color:var(--k)}
dl.vocab{margin:0}
dl.vocab dt{font-weight:800;margin-top:8px}
dl.vocab dd{margin:0 0 0 0;color:#374151}
.note{min-height:52px;margin-top:8px;padding:10px 12px;background:#f9fafb;border-radius:10px}
.eqline{text-align:center;font-size:1.7em;margin-top:4px}
/* steps */
.ln-step{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;align-items:center;padding:10px 0;border-top:1px dashed #e5e7eb;animation:fade .35s}
.ln-step .m{font-size:1.3em;text-align:center}
.ln-step .why{font-size:15.5px;color:#374151;background:#f9fafb;border-radius:8px;padding:6px 10px}
.ln-step.hide{display:none}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.prob{font-size:18px}
.mistake{border-left:6px solid var(--bad)}
.mistake .tag{color:var(--bad)}
.mk{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.mk div{padding:10px;border-radius:10px;text-align:center}
.mk .x{background:#fef2f2}.mk .o{background:#f0fdf4}
/* practice */
.pencilnote{background:#fffbeb;border:1px dashed #f59e0b;border-radius:10px;padding:8px 12px;margin:8px 0 12px;font-size:15.5px}
.fld{display:inline-flex;align-items:center;gap:8px;margin:6px 14px 6px 0;font-weight:700}
.fld input{font:inherit;font-size:18px;width:120px;padding:8px 10px;border:2px solid #d1d5db;border-radius:10px}
.fld input:focus{outline:none;border-color:var(--acc)}
.opt{display:flex;width:100%;text-align:left;margin:6px 0;justify-content:flex-start}
.opt.right{background:#f0fdf4;border-color:var(--ok);color:var(--ok);font-weight:700}
.opt.wrong{background:#fef2f2;border-color:var(--bad);color:var(--bad)}
.opt.sel{border:2px solid var(--acc);background:#eff6ff}
.fb{margin-top:10px;font-weight:600;min-height:1em}
.fb.okk{color:var(--ok)}.fb.no{color:var(--bad)}
.solbox{margin-top:10px;background:#f9fafb;border-radius:10px;padding:8px 12px}
.streak{margin-top:12px;font-size:14.5px;color:var(--mute)}
table.t{border-collapse:collapse;margin:8px 0}
table.t td,table.t th{border:1px solid #d1d5db;padding:5px 14px;text-align:center}
table.t th{background:#f3f4f6}
/* quiz */
.qq{padding:12px 0;border-top:1px solid var(--line)}
.qq .why{display:none;margin-top:6px;font-size:15.5px;background:#f9fafb;border-radius:8px;padding:6px 10px}
.qq.shown .why{display:block}
.done-banner{background:#f0fdf4;border:1px solid #86efac;border-radius:12px;padding:14px;margin-top:12px;font-weight:700}
/* widgets */
.ctrl{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin:6px 0}
.ctrl label{font-weight:700;display:flex;align-items:center;gap:8px}
input[type=range]{width:200px;accent-color:var(--acc)}
.readout{margin-top:8px;padding:10px 12px;background:#f9fafb;border-radius:10px}
.anat{display:flex;justify-content:center;align-items:flex-start;gap:10px;flex-wrap:wrap;margin:8px 0}
.term{text-align:center}
.tbox{font-family:"Cambria Math","Times New Roman",serif;font-size:42px;border:3px solid #d1d5db;border-radius:12px;padding:2px 16px;background:#fff}
.tl{font-size:14px;color:#374151;margin-top:4px;max-width:150px}
.op{font-size:42px;padding-top:6px}
.legend{display:flex;flex-wrap:wrap;gap:10px 20px;justify-content:center;font-size:15px}
.stepper2{display:inline-flex;align-items:center;gap:6px}
.stepper2 b{min-width:26px;text-align:center;font-size:20px}
.darts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center;font-size:14px}
.darts b{display:block}
.tri-btns button.on{background:#fef9c3;border-color:#ca8a04;font-weight:800}
@media (max-width:640px){
 body{font-size:16px}
 h1{font-size:23px}
 .ln-step{grid-template-columns:1fr;gap:4px}
 .darts{grid-template-columns:repeat(2,1fr)}
 .pill{font-size:13px;padding:9px 2px} .pill .ic{display:none}
 .stepper{top:53px}
 .tbox{font-size:32px}.op{font-size:32px}
 input[type=range]{width:150px}
}
footer{text-align:center;font-size:13px;color:var(--mute);padding:20px}
</style>
</head>
<body>
<header class="top"><a class="brand" href="#/">Algebra 1 <span>Visual Lab</span></a><span class="topprog" id="topprog"></span></header>
<main id="app"></main>
<footer>Picture → Steps → Pencil → Check · Follows the Algebra 1A &amp; 1B module sequence</footer>
<script>
/* ============ helpers ============ */
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>[...el.querySelectorAll(s)];
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const MINUS='−';
function fmtNeg(n){n=+(+n).toFixed(4);return (n<0?MINUS:'')+Math.abs(n);}
function frac(n,d){if(d<0){n=-n;d=-d;}const g=gcd(Math.abs(n),d)||1;n/=g;d/=g;return d===1?fmtNeg(n):(n<0?MINUS:'')+Math.abs(n)+'/'+d;}
function T(c,v){return c===1?v:c===-1?MINUS+v:fmtNeg(c)+v;}
function S(n){return n<0?' '+MINUS+' '+fmtNeg(-n):' + '+fmtNeg(n);}
function P(n){return n<0?'('+fmtNeg(n)+')':fmtNeg(n);}
function mx(s){return String(s).replace(/[a-zA-Z]/g,c=>`<i class="v">${c}</i>`);}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function mcFrom(correct,wrongs){const opts=shuffle([correct,...wrongs]);return {opts,a:opts.indexOf(correct)};}
function parseAns(s){s=String(s).trim().replace(/[−–]/g,'-').replace(/\s+/g,'').replace(/^\$/,'').replace(/%$/,'').replace(/,/g,'');
 if(!s)return NaN;
 if(/^-?\d+(\.\d+)?\/-?\d+(\.\d+)?$/.test(s)){const [a,b]=s.split('/').map(Number);return b===0?NaN:a/b;}
 if(/^-?(\d+\.?\d*|\.\d+)$/.test(s))return Number(s);
 return NaN;}

/* ============ storage ============ */
const STORE='alg1lab-v1';
let PR={};try{PR=JSON.parse(localStorage.getItem(STORE))||{};}catch(e){PR={};}
function save(){try{localStorage.setItem(STORE,JSON.stringify(PR));}catch(e){}}
function prog(id){return PR[id]||(PR[id]={});}
function isDone(id){return !!(PR[id]&&PR[id].done);}

/* ============ course map ============ */
const COURSE=[
{id:'1A',modules:[
 {n:1,title:'Algebraic Modeling',color:'#2563eb',lessons:['Solving Equations','Reporting with Precision and Accuracy','Modeling with Expressions','Creating and Solving Equations','Solving for a Variable in a Formula']},
 {n:2,title:'Characteristics of Linear Relationships',color:'#0891b2',lessons:['Understanding Linear Equations','Using Intercepts','Interpreting Rate of Change and Slope','Slope-Intercept Form','Modeling Linear Relationships','Understanding Relations and Functions','Modeling with Functions']},
 {n:3,title:'Understanding Linear Functions',color:'#059669',lessons:['Graphing Functions','Using Functions to Solve One-Variable Equations','Linear Inequalities in Two Variables','Graphing Relationships','Identifying and Graphing Sequences','Constructing Arithmetic Sequences']},
 {n:4,title:'Linear Systems',color:'#d97706',lessons:['Solving Linear Systems by Graphing','Solving Linear Systems by Substitution','Solving Linear Systems by Adding or Subtracting','Solving Linear Systems by Multiplying','Creating Systems of Linear Equations','Graphing Systems of Linear Inequalities']},
 {n:5,title:'Linear and Statistical Models',color:'#0d9488',lessons:['Measures of Center and Spread','Dot Plots, Histograms, and Outliers','Normal Distributions & Probability','Scatter Plots and Trend Lines','Fitting a Linear Model to Data']}]},
{id:'1B',modules:[
 {n:1,title:'Exponential Relationships',color:'#9333ea',lessons:['Constructing Exponential Functions','Graphing Exponential Functions','Modeling Exponential Growth and Decay','Understanding Geometric Sequences','Constructing Geometric Sequences']},
 {n:2,title:'Polynomial Operations',color:'#db2777',lessons:['Understanding Polynomial Expressions','Adding Polynomial Expressions','Subtracting Polynomial Expressions','Multiplying Polynomial Expressions by Monomials','Multiplying Polynomial Expressions']},
 {n:3,title:'Quadratic Equations and Modeling',color:'#e11d48',lessons:['Connecting Intercepts and Zeros','Solving Equations by Factoring x² + bx + c','Solving Equations by Factoring ax² + bx + c','Solving Equations by Taking Square Roots','Using the Quadratic Formula to Solve Equations','Solving Equations by Completing the Square']},
 {n:4,title:'Quadratic Functions',color:'#4f46e5',lessons:['Describing Effects on Quadratic Functions','Transforming Quadratic Functions','Interpreting Vertex and Standard Form','Interpreting Factored Form and Standard Form']},
 {n:5,title:'Linear, Exponential, and Quadratic Functions',color:'#475569',lessons:['Comparing Linear and Exponential Models','Modeling with Quadratic Functions','Comparing Properties of Linear, Exponential, and Quadratic Functions','Solving Nonlinear Systems']}]}];
const ORDER=[];const META={};
COURSE.forEach(c=>c.modules.forEach(m=>m.lessons.forEach((t,i)=>{const id=`${c.id}-${m.n}-${i+1}`;ORDER.push(id);META[id]={c:c.id,m:m.n,mt:m.title,n:i+1,title:t,color:m.color};})));

/* ============ graph grid ============ */
let GID=0;
function grid(o){
 const {x0=-6,x1=6,y0=-6,y1=6,u=30,lab=2,xl='',yl=''}=o;const pad=28;
 const W=(x1-x0)*u+pad*2,H=(y1-y0)*u+pad*2;const X=x=>pad+(x-x0)*u,Y=y=>pad+(y1-y)*u;const id='clp'+(++GID);
 let s=`<defs><clipPath id="${id}"><rect x="${X(x0)}" y="${Y(y1)}" width="${(x1-x0)*u}" height="${(y1-y0)*u}"/></clipPath></defs>`;
 for(let x=x0;x<=x1;x++)s+=`<line x1="${X(x)}" y1="${Y(y0)}" x2="${X(x)}" y2="${Y(y1)}" class="gl"/>`;
 for(let y=y0;y<=y1;y++)s+=`<line x1="${X(x0)}" y1="${Y(y)}" x2="${X(x1)}" y2="${Y(y)}" class="gl"/>`;
 const ay=(y0<=0&&y1>=0)?Y(0):Y(y0),axx=(x0<=0&&x1>=0)?X(0):X(x0);
 s+=`<line x1="${X(x0)}" y1="${ay}" x2="${X(x1)}" y2="${ay}" class="ax"/><line x1="${axx}" y1="${Y(y0)}" x2="${axx}" y2="${Y(y1)}" class="ax"/>`;
 for(let x=x0;x<=x1;x++)if(x!==0&&x%lab===0)s+=`<text x="${X(x)}" y="${ay+16}" text-anchor="middle" class="tl">${fmtNeg(x)}</text>`;
 for(let y=y0;y<=y1;y++)if(y!==0&&y%lab===0)s+=`<text x="${axx-6}" y="${Y(y)+4}" text-anchor="end" class="tl">${fmtNeg(y)}</text>`;
 if(xl)s+=`<text x="${X(x1)}" y="${ay-8}" text-anchor="end" class="tl" font-weight="700">${xl}</text>`;
 if(yl)s+=`<text x="${axx+6}" y="${Y(y1)-8}" class="tl" font-weight="700">${yl}</text>`;
 return {W,H,X,Y,x0,x1,y0,y1,u,clip:id,base:s,svg:inner=>`<svg viewBox="0 0 ${W} ${H}" class="fig" style="max-width:${Math.min(W,480)}px">${s}${inner}</svg>`};
}
function gline(g,m,b,cls='ln',extra=''){const a=g.x0-1,z=g.x1+1;return `<line clip-path="url(#${g.clip})" x1="${g.X(a)}" y1="${g.Y(m*a+b)}" x2="${g.X(z)}" y2="${g.Y(m*z+b)}" class="${cls}" ${extra}/>`;}
function gdot(g,x,y,col='#1f2937',r=6,label=''){return `<circle cx="${g.X(x)}" cy="${g.Y(y)}" r="${r}" fill="${col}" stroke="#fff" stroke-width="2"/>`+(label?`<text x="${g.X(x)+9}" y="${g.Y(y)-9}" font-size="13" font-weight="700" fill="${col}" paint-order="stroke" stroke="#fff" stroke-width="4">${label}</text>`:'');}

/* ============ diagrams / widgets ============ */
// Balance scale
function scaleSVG(L,R,a){
 const r=a*Math.PI/180,cx=280,cy=110,len=190;
 const lx=cx-len*Math.cos(r),ly=cy-len*Math.sin(r),rx=cx+len*Math.cos(r),ry=cy+len*Math.sin(r);
 let s=`<path d="M${cx} ${cy} L${cx} 262" stroke="#9ca3af" stroke-width="10"/><path d="M${cx-70} 290 L${cx+70} 290 L${cx+34} 262 L${cx-34} 262Z" fill="#9ca3af"/>`;
 s+=`<line x1="${lx}" y1="${ly}" x2="${rx}" y2="${ry}" stroke="#4b5563" stroke-width="9" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="10" fill="#374151"/>`;
 return s+pan(lx,ly,L)+pan(rx,ry,R);
}
function pan(x,y,c){
 const py=y+100;let s=`<line x1="${x}" y1="${y}" x2="${x-72}" y2="${py}" stroke="#9ca3af" stroke-width="2"/><line x1="${x}" y1="${y}" x2="${x+72}" y2="${py}" stroke="#9ca3af" stroke-width="2"/><path d="M${x-86} ${py} Q${x} ${py+30} ${x+86} ${py}Z" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>`;
 const base=py-1,left=x-80;
 for(let i=0;i<(c.x||0);i++){const bx=left+i*40;s+=`<rect x="${bx}" y="${base-36}" width="36" height="36" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><text x="${bx+18}" y="${base-11}" text-anchor="middle" font-size="22" font-style="italic" font-weight="700" fill="#2563eb" font-family="Georgia,serif">x</text>`;}
 const x0=left+(c.x||0)*40,w=160-(c.x||0)*40,cols=Math.max(1,Math.floor(w/18));
 for(let i=0;i<(c.k||0);i++){const col=i%cols,row=Math.floor(i/cols);s+=`<rect x="${x0+col*18}" y="${base-16-row*18}" width="16" height="16" rx="2" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/>`;}
 const lbl=[(c.x?T(c.x,'x'):''),(c.k?String(c.k):'')].filter(Boolean).join(' + ');
 s+=`<text x="${x}" y="${py+40}" text-anchor="middle" font-size="18" font-weight="700" fill="#374151">${lbl}</text>`;
 return s;
}
function mountBalance(el){
 const SS=[{L:{x:2,k:3},R:{k:11},eq:'2x + 3 = 11',a:0,note:'Balanced. The left pan (2 tickets + $3) weighs the same as the right pan ($11).'},
 {L:{x:2},R:{k:8},eq:'2x = 8',a:0,note:'<b>Subtraction Property of Equality:</b> you took $3 off <b>both</b> pans, so it is still balanced. Two tickets cost $8.'},
 {L:{x:1},R:{k:4},eq:'x = 4',a:0,note:'<b>Division Property of Equality:</b> you split <b>both</b> pans into 2 equal groups and kept one. <span class="good">One ticket costs $4.</span>'}];
 const WR={L:{x:2},R:{k:11},eq:'2x  ?  11',a:9,note:'<span class="bad">Unbalanced!</span> You took $3 off the left pan only. Whatever you do to one side, you must do to the other side.'};
 let st=0,wrong=false;
 el.innerHTML=`<svg viewBox="0 60 560 240" class="fig" style="max-width:560px"></svg><div class="eqline math"></div><div class="note"></div>
 <div class="row"><button data-a="sub">− 3 from both sides</button><button data-a="div">÷ 2 on both sides</button><button data-a="wrong">− 3 from left side only?</button><button data-a="reset">↺ Reset</button></div>`;
 const draw=()=>{const s=wrong?WR:SS[st];$('svg',el).innerHTML=scaleSVG(s.L,s.R,s.a);$('.eqline',el).innerHTML=mx(s.eq);$('.note',el).innerHTML=s.note;
  $('[data-a=sub]',el).disabled=!(st===0&&!wrong);$('[data-a=div]',el).disabled=!(st===1&&!wrong);$('[data-a=wrong]',el).disabled=!(st===0&&!wrong);};
 el.addEventListener('click',e=>{const a=e.target.closest('button')?.dataset.a;if(!a)return;if(a==='sub')st=1;if(a==='div')st=2;if(a==='wrong')wrong=true;if(a==='reset'){st=0;wrong=false;}draw();});
 draw();
}
// Dartboards
function board(darts){let s=`<svg viewBox="0 0 160 160" class="fig" style="max-width:150px">`;
 [[70,'#fff'],[52,'#e5e7eb'],[34,'#fff'],[17,'#fecaca'],[6,'#dc2626']].forEach(([r,f])=>s+=`<circle cx="80" cy="80" r="${r}" fill="${f}" stroke="#9ca3af"/>`);
 darts.forEach(([x,y])=>s+=`<circle cx="${80+x}" cy="${80+y}" r="5" fill="#1f2937" stroke="#fff" stroke-width="1.5"/>`);return s+'</svg>';}
function mountDarts(el){
 const B=[[[[2,-3],[-3,2],[4,3],[-1,-4],[1,1]],'Precise ✓','Accurate ✓'],[[[-38,-34],[-33,-39],[-36,-29],[-42,-31],[-31,-33]],'Precise ✓','Accurate ✗'],[[[-40,10],[36,-25],[8,44],[-22,-38],[30,28]],'Precise ✗','Accurate ✓ (on average)'],[[[-48,30],[18,52],[52,8],[-8,60],[40,46]],'Precise ✗','Accurate ✗']];
 el.innerHTML=`<div class="darts">${B.map(b=>`<div>${board(b[0])}<b>${b[1]}</b>${b[2]}</div>`).join('')}</div>

  return {q:`Solve for <i class="v">x</i>. Write each step and its reason on paper.<div class="math big" style="margin-top:6px">${mx(first)}</div>`,fields:[{label:'x =',answer:x}],hint:b>0?`First undo “+ ${b}”: subtract ${b} from both sides.`:`First undo “− ${-b}”: add ${-b} to both sides.`,sol};},

  {q:'To solve 4x + 7 = 31, what is a good first step that keeps the scale balanced?',o:['Subtract 7 from both sides','Subtract 7 from the left side only','Divide only the left side by 4','Add 7 to both sides'],a:0,why:'Undo “+ 7” by subtracting 7 from BOTH sides: 4x = 24.'},
  {q:'Which property justifies going from x ÷ 3 = 6 to x = 18?',o:['Addition Property of Equality','Division Property of Equality','Multiplication Property of Equality','Combining like terms'],a:2,why:'You multiplied both sides by 3 — the Multiplication Property of Equality.'},
  {q:'Solve 6x − 2x + 5 = 29.',o:['x = 8.5','x = 6','x = 24','x = 3'],a:1,why:'6x − 2x = 4x, so 4x + 5 = 29 → 4x = 24 → x = 6.'}]

L['1A-1-3']={
 goal:'I can create and interpret algebraic expressions to describe real-world scenarios.',
 life:{title:'Family day at an amusement park',html:'Adult tickets cost <b>$60</b> and child tickets cost <b>$30</b>. If <i class="v">a</i> adults and <i class="v">c</i> children go, the total cost is <span class="math">'+mx('60a + 30c')+'</span>.<br>Same idea with a phone plan: $25 a month + $10 per GB of extra data → <span class="math">'+mx('25 + 10g')+'</span>.'},
 see:[{title:'Every part of an expression has a meaning',hint:'Change the number of adults and children. Watch which part of the expression changes.',mount:mountTickets}],
 vocab:[['Expression','A math phrase with numbers, variables, and operations — no equal sign.'],['Term','A part of an expression separated by + or −. In 8p − 2q + 7 the terms are 8p, −2q, 7.'],['Coefficient','The number multiplying a variable (8 and −2 above). In a story it is often a rate: “$ per item”.'],['Constant','A term with no variable (7 above). In a story it is often a one-time fee or a starting amount.']],
 examples:[
  {title:'Example 1 — Write and use an expression',prob:'A gym charges a <b>$25</b> sign-up fee plus <b>$15 per month</b>. Write an expression for <i class="v">m</i> months. Then find the cost of 6 months.',lines:[
   ['15m','$15 for every month → coefficient 15 times the variable m.'],['15m + 25','Add the one-time $25 fee (a constant term).'],['15(6) + 25','Substitute m = 6.'],['90 + 25','Multiply first (order of operations).'],['115','Six months cost $115.']]},
  {title:'Example 2 — Name the parts',prob:'Identify the terms, coefficients, and constant of <span class="math">'+mx('8p − 2q + 7')+'</span>.',raw:true,lines:[
   ['Terms: 8<i class="v">p</i>, −2<i class="v">q</i>, +7','Terms are separated by + and − signs. Keep the sign with the term.'],['Coefficients: 8 and −2','The numbers multiplying the variables (the − sign belongs to 2).'],['Constant: 7','The term with no variable.']]}],
 mistake:{bad:'In 8p − 2q + 7, the coefficient of q is 2',good:'The coefficient of q is −2',why:'The sign in front of a term belongs to that term.'},
 practice(){
  const r=rand(2,12);let f=rand(3,25);if(f===r)f++;
  const C=pick([{t:`A bowling alley charges <b>$${r}</b> per game plus <b>$${f}</b> for shoe rental.`,v:'g',n:'games'},{t:`A rideshare charges a <b>$${f}</b> booking fee plus <b>$${r}</b> per mile.`,v:'d',n:'miles'},{t:`A school club sells T-shirts for <b>$${r}</b> each and already has <b>$${f}</b> in its account.`,v:'s',n:'shirts sold'},{t:`A phone plan costs <b>$${f}</b> a month plus <b>$${r}</b> for each GB of extra data.`,v:'x',n:'GB of extra data'}]);
  const v=C.v,ty=pick(['mc','eval','coef']);

   return {type:'mc',q:`${C.t} Let <i class="v">${v}</i> = number of ${C.n}. Which expression gives the total?`,opts:m.opts,a:m.a,why:`The rate $${r} multiplies ${v} (it changes with each one); the $${f} is added once.`};}
  if(ty==='eval'){const n=rand(2,9);return {q:`${C.t} Let <i class="v">${v}</i> = number of ${C.n}. The total is <span class="math">${mx(`${r}${v} + ${f}`)}</span>. What is the total when <i class="v">${v}</i> = ${n}?`,fields:[{label:'Total = $',answer:r*n+f}],hint:`Substitute ${v} = ${n}, multiply, then add.`,sol:[[`${r}(${n}) + ${f}`,`Substitute ${v} = ${n}.`],[`${r*n} + ${f}`,'Multiply first.'],[`${r*n+f}`,`The total is $${r*n+f}.`]]};}
  return {q:`${C.t} Let <i class="v">${v}</i> = number of ${C.n}. The total is <span class="math">${mx(`${r}${v} + ${f}`)}</span>. What is the <b>coefficient</b>?`,fields:[{label:'Coefficient =',answer:r}],hint:'The coefficient is the number multiplying the variable.',sol:[[`${r}${v}`,`${r} multiplies ${v}, so the coefficient is ${r}. It means $${r} for each one of the ${C.n}.`]]};},
 check:[
  {q:'In 8p − 2q + 7, what is the coefficient of q?',o:['2','−2','7','q'],a:1,why:'The minus sign belongs to the term: −2q.'},

  {q:'In 60a + 30c (adult and child tickets), what does 30c represent?',o:['The number of children','The total cost for the children','The price of one adult ticket','The total cost for everyone'],a:1,why:'30 dollars × c children = the total cost for the children.'}]
};

  {title:'Example 2 — From a table',prob:'<table class="t"><tr><th>Hours worked</th><td>2</td><td>5</td></tr><tr><th>Pay ($)</th><td>30</td><td>75</td></tr></table>Find and interpret the rate of change.',raw:true,lines:[
   ['(75 − 30) ÷ (5 − 2)','Change in pay ÷ change in hours.'],['= 45 ÷ 3','Subtract.'],['= 15','Divide.'],['$15 per hour','Interpret: each extra hour of work adds $15.']]}],
 mistake:{bad:'m = (5 − 1) ÷ (8 − 2)',good:'m = (8 − 2) ÷ (5 − 1)',why:'Slope is <b>y</b> change on top, <b>x</b> change on the bottom — “rise over run”.'},
 practice(){
  if(Math.random()<.65){let x1,y1,x2,y2;do{x1=rand(-5,5);y1=rand(-5,5);x2=rand(-5,5);y2=rand(-5,5);}while(x1===x2||(Math.abs(x2-x1)<2&&Math.abs(y2-y1)<2));
   const g=grid({u:24});const m=(y2-y1)/(x2-x1);
   const fig=g.svg(gline(g,m,y1-m*x1)+gdot(g,x1,y1,'#ea580c',7,`(${fmtNeg(x1)}, ${fmtNeg(y1)})`)+gdot(g,x2,y2,'#1f2937',7,`(${fmtNeg(x2)}, ${fmtNeg(y2)})`));
   return {q:`Find the slope of the line through <b>(${fmtNeg(x1)}, ${fmtNeg(y1)})</b> and <b>(${fmtNeg(x2)}, ${fmtNeg(y2)})</b>. <span class="mute">Fractions like −3/4 are OK.</span>`,fig,fields:[{label:'m =',answer:m}],hint:'Count the rise (up/down) and the run (right) between the points, or use (y₂ − y₁) ÷ (x₂ − x₁).',
    sol:[[`m = (${fmtNeg(y2)} − ${P(y1)}) ÷ (${fmtNeg(x2)} − ${P(x1)})`,'Substitute into the slope formula.'],[`m = ${fmtNeg(y2-y1)} ÷ ${fmtNeg(x2-x1)}`,'Subtract.'],[`m = ${frac(y2-y1,x2-x1)}`,'Simplify.']],raw:true};}
  const k=pick(['pay','tank','phone']);
  if(k==='pay'){const r=pick([12,14,15,16,18,20]),a=rand(1,4),b=a+rand(2,5);return {q:`<table class="t"><tr><th>Hours worked</th><td>${a}</td><td>${b}</td></tr><tr><th>Pay ($)</th><td>${a*r}</td><td>${b*r}</td></tr></table>What is the rate of change (dollars per hour)?`,fields:[{label:'Rate =',answer:r,unit:'$ per hour'}],raw:true,hint:'Change in pay ÷ change in hours.',sol:[[`(${b*r} − ${a*r}) ÷ (${b} − ${a})`,'Change in pay ÷ change in hours.'],[`${(b-a)*r} ÷ ${b-a} = ${r}`,`$${r} per hour.`]]};}
  if(k==='tank'){const r=pick([2,3,4,5,6]),s=rand(60,90),a=rand(1,4),b=a+rand(3,6);return {q:`A water tank is draining. <table class="t"><tr><th>Minutes</th><td>${a}</td><td>${b}</td></tr><tr><th>Liters left</th><td>${s-a*r}</td><td>${s-b*r}</td></tr></table>What is the rate of change (liters per minute)?`,fields:[{label:'Rate =',answer:-r,unit:'L per minute'}],raw:true,hint:'The amount is going DOWN, so the rate is negative.',sol:[[`(${s-b*r} − ${s-a*r}) ÷ (${b} − ${a})`,'Change in liters ÷ change in minutes.'],[`${fmtNeg(-(b-a)*r)} ÷ ${b-a} = ${fmtNeg(-r)}`,`The tank loses ${r} liters each minute.`]]};}
  const r=pick([2,4,5,8,10]),a=rand(1,3),b=a+rand(2,4);return {q:`Your phone battery while gaming: <table class="t"><tr><th>Hours</th><td>${a}</td><td>${b}</td></tr><tr><th>Battery (%)</th><td>${100-a*r*2}</td><td>${100-b*r*2}</td></tr></table>What is the rate of change (% per hour)?`,fields:[{label:'Rate =',answer:-2*r,unit:'% per hour'}],raw:true,hint:'Change in battery ÷ change in hours. Going down → negative.',sol:[[`(${100-b*r*2} − ${100-a*r*2}) ÷ (${b} − ${a})`,'Change in % ÷ change in hours.'],[`${fmtNeg(-(b-a)*r*2)} ÷ ${b-a} = ${fmtNeg(-2*r)}`,`The battery drops ${2*r}% each hour.`]]};},
 check:[
  {q:'A line slants DOWN as you read from left to right. Its slope is…',o:['positive','negative','zero','undefined'],a:1,why:'Going down from left to right means a negative rise for a positive run.'},
  {q:'What is the slope of the line through (1, 2) and (3, 8)?',o:['1/3','6','3','4'],a:2,why:'(8 − 2) ÷ (3 − 1) = 6 ÷ 2 = 3.'},
  {q:'What is the slope of a vertical line?',o:['0','1','undefined','infinite and positive'],a:2,why:'The run is 0, and you can’t divide by 0.'}]
};

L['1A-2-4']={
 goal:'I can graph linear equations written in slope-intercept form, y = mx + b.',
 life:{title:'A taxi ride',html:'A taxi charges <b>$3</b> as soon as you get in, plus <b>$2 per mile</b>. Cost: <span class="math">'+mx('y = 2x + 3')+'</span>.<br>The <span class="k">$3</span> is where the graph <b>starts</b> (the y-intercept, b). The <b style="color:#7c3aed">$2 per mile</b> is how steeply it <b>climbs</b> (the slope, m). Tap the 🚕 button below to see it.'},
 see:[{title:'Start at b, then step with m',hint:'Move the sliders. Orange dot = y-intercept. Purple = rise, green = run.',mount:mountSI}],
 vocab:[['Slope-intercept form','y = mx + b'],['m (slope)','The rise over run — how the line moves for each step.'],['b (y-intercept)','Where the line crosses the y-axis: the point (0, b). In a story, the starting amount.']],
 examples:[
  {title:'Example A — Graph y = (3/4)x − 2',prob:'Graph <span class="math">'+mx('y = (3/4)x − 2')+'</span> using the slope and the y-intercept.',lines:[
   ['m = 3/4, b = −2','Step 1: Identify the slope and the y-intercept.'],['(0, −2)','Step 2: Plot the y-intercept first.'],['(0, −2) → (4, 1)','Step 3: Use the slope: up 3, right 4. Plot the new point.'],['y = (3/4)x − 2','Step 4: Connect the points with a straight line.']]},
  {title:'Example B — Rewrite first',prob:'Graph <span class="math">'+mx('x + 3y = 6')+'</span>.',lines:[
   ['x + 3y = 6','Not in slope-intercept form yet.'],['3y = −x + 6','Subtract x from both sides.'],['y = −(1/3)x + 2','Divide every term by 3.'],['m = −1/3, b = 2','Start at (0, 2), then down 1, right 3 → (3, 1).']]}],
 mistake:{bad:'y = 2x + 3: start at (0, 2)',good:'Start at (0, 3)',why:'b is the number <b>added</b> at the end. The coefficient of x is the slope.'},
 practice(){
  if(Math.random()<.6){let num,den,b;do{[num,den]=pick(MS.filter(m=>m[0]!==0));b=rand(-4,4);}while(b+num>6||b+num<-6||den>6);
   const g=grid({u:24});const fig=g.svg(gline(g,num/den,b)+gdot(g,0,b,'#1f2937',6)+gdot(g,den,b+num,'#1f2937',6));
   return {q:'Look at the graph. What are the slope <i class="v">m</i> and the y-intercept <i class="v">b</i>? <span class="mute">Fractions like 2/3 are OK.</span>',fig,fields:[{label:'m =',answer:num/den},{label:'b =',answer:b}],hint:'b: where does the line cross the y-axis? m: from that point, count up/down (rise) and right (run) to the next dot.',
    sol:[[`b = ${fmtNeg(b)}`,`The line crosses the y-axis at (0, ${fmtNeg(b)}).`],[`m = ${frac(num,den)}`,`From (0, ${fmtNeg(b)}) to (${den}, ${fmtNeg(b+num)}): ${num>0?'up':'down'} ${Math.abs(num)}, right ${den}.`],[eqStr(num,den,b),'The equation of the line.']]};}
  let m=rand(-3,3);if(!m)m=2;const b=rand(-5,5),B=pick([1,2,3]),A=-m*B,C=b*B;
  const eq=`${T(A,'x')} ${B>0?'+':MINUS} ${T(Math.abs(B),'y')} = ${fmtNeg(C)}`;
  return {q:`Rewrite <span class="math">${mx(eq)}</span> in slope-intercept form. What are <i class="v">m</i> and <i class="v">b</i>?`,fields:[{label:'m =',answer:m},{label:'b =',answer:b}],hint:'Move the x-term to the right side, then divide every term by the number in front of y.',
   sol:[[`${T(B,'y')} = ${T(-A,'x')}${S(C)}`,`Subtract ${T(A,'x')} from both sides.`],[eqStr(m,1,b),B===1?'Already solved for y.':`Divide every term by ${B}.`],[`m = ${fmtNeg(m)}, b = ${fmtNeg(b)}`,'Read the slope and the y-intercept.']]};},
 check:[
  {q:'For y = −2x + 5, what are the slope and y-intercept?',o:['m = 5, b = −2','m = −2, b = 5','m = 2, b = 5','m = −2, b = −5'],a:1,why:'y = mx + b: m is the coefficient of x (−2), b is the constant (5).'},
  {q:'Rewrite 2x + y = 7 in slope-intercept form.',o:['y = 2x + 7','y = −2x + 7','y = 7x − 2','y = −2x − 7'],a:1,why:'Subtract 2x from both sides: y = −2x + 7.'},
  {q:'A taxi charges $3 plus $2 per mile. Which equation gives the cost y for x miles?',o:['y = 3x + 2','y = 5x','y = 2x + 3','y = 2x − 3'],a:2,why:'The rate $2 per mile is the slope; the $3 start is the y-intercept.'}]
};

/* ============ views ============ */
const STAGES=[{k:'pic',n:'Picture',i:'🖼'},{k:'steps',n:'Steps',i:'🪜'},{k:'pencil',n:'Pencil',i:'✏️'},{k:'check',n:'Check',i:'✅'}];
const app=$('#app');
const avail=ORDER.filter(id=>L[id]);
function nextLesson(id){const i=avail.indexOf(id);return avail[i+1];}
function topProg(){$('#topprog').textContent=`${avail.filter(isDone).length} of ${ORDER.length} lessons done`;}

function renderHome(){
 const nid=avail.find(id=>!isDone(id))||avail[0],anyDone=avail.some(isDone),done=avail.filter(isDone).length;
 app.innerHTML=`<div class="wrap"><div class="card hero"><h1>Algebra 1 Visual Lab</h1><p style="margin:4px 0">See the idea first. Then do it with your pencil.</p>
 <div class="flow"><span>🖼 1. Picture</span><span>🪜 2. Steps</span><span>✏️ 3. Pencil</span><span>✅ 4. Check</span></div>
 <a class="btn primary" href="#/l/${nid}/0">${anyDone?'Continue':'Start'}: ${META[nid].title} ▶</a>
 <div class="bar"><i style="width:${done/ORDER.length*100}%"></i></div><div class="mute" style="font-size:14px">${done} of ${ORDER.length} lessons complete · ${avail.length} lessons open now, more coming soon</div></div>
 ${COURSE.map(c=>`<h2>Algebra ${c.id}</h2><div class="mods">${c.modules.map(m=>`<div class="mod" style="--mc:${m.color}"><span class="mn">Module ${m.n}</span><b>${m.title}</b><ol>${m.lessons.map((t,i)=>{const id=`${c.id}-${m.n}-${i+1}`;return L[id]?`<li><a href="#/l/${id}/0"><span class="st ${isDone(id)?'d':''}">${isDone(id)?'✓':'○'}</span>${i+1}. ${t}</a></li>`:`<li class="soon"><span class="st">·</span>${i+1}. ${t}<small>soon</small></li>`;}).join('')}</ol></div>`).join('')}</div>`).join('')}</div>`;
}

function renderLesson(id,stage){
 const M=META[id],D=L[id],pr=prog(id);document.documentElement.style.setProperty('--acc',M.color);
 const nx=nextLesson(id);
 app.innerHTML=`<div class="wrap"><a href="#/">← All lessons</a><div class="crumb">Algebra ${M.c} · Module ${M.m}: ${M.mt} · Lesson ${M.n}</div><h1>${M.title}</h1><div class="goal">🎯 ${D.goal}</div>
 <nav class="stepper">${STAGES.map((s,i)=>`<a class="pill ${i===stage?'on':''} ${pr[s.k]?'done':''}" data-k="${s.k}" href="#/l/${id}/${i}"><span class="ic">${s.i} </span>${s.n}</a>`).join('')}</nav>
 <section id="stage"></section>
 <div class="navrow">${stage>0?`<a class="btn" href="#/l/${id}/${stage-1}">◀ ${STAGES[stage-1].n}</a>`:'<span></span>'}${stage<3?`<a class="btn primary" href="#/l/${id}/${stage+1}">Next: ${STAGES[stage+1].n} ▶</a>`:(nx?`<a class="btn" href="#/l/${nx}/0">Next lesson ▶</a>`:'<a class="btn" href="#/">All lessons</a>')}</div></div>`;
 const el=$('#stage');[stPicture,stSteps,stPencil,stCheck][stage](el,id,D,pr);
}
function markStage(id,k){const pr=prog(id);if(!pr[k]){pr[k]=true;save();}const p=$(`.pill[data-k="${k}"]`);if(p)p.classList.add('done');}

function stPicture(el,id,D){
 el.innerHTML=`<div class="card life"><div class="tag">Real life</div><h3>${D.life.title}</h3><div>${D.life.html}</div></div>
 ${D.see.map((s,i)=>`<div class="card"><div class="tag">See it</div><h3>${s.title}</h3><p class="mute" style="margin-top:0">${s.hint}</p><div id="see${i}"></div></div>`).join('')}
 <div class="card"><div class="tag">Key words</div><dl class="vocab">${D.vocab.map(v=>`<dt>${v[0]}</dt><dd>${v[1]}</dd>`).join('')}</dl></div>`;
 D.see.forEach((s,i)=>s.mount($('#see'+i)));markStage(id,'pic');
}
function lineHTML(l,raw,hide){return `<div class="ln-step ${hide?'hide':''}"><div class="m math">${raw?l[0]:mx(l[0])}</div><div class="why">${l[1]}</div></div>`;}
function stSteps(el,id,D){
 el.innerHTML=D.examples.map((e,i)=>`<div class="card ex" data-i="${i}"><div class="tag">${e.title}</div><div class="prob">${e.prob}</div><div class="lines">${e.lines.map((l,j)=>lineHTML(l,e.raw,j>0)).join('')}</div>
 <div class="row"><button class="primary" data-a="next">Next step ▼</button><button data-a="all">Show all</button></div></div>`).join('')+
 `<div class="card mistake"><div class="tag">⚠ Common mistake</div><div class="mk"><div class="x"><span class="bad">✗</span> <span class="math">${D.mistake.bad}</span></div><div class="o"><span class="good">✓</span> <span class="math">${D.mistake.good}</span></div></div><p style="margin-bottom:0">${D.mistake.why}</p></div>`;
 const chk=()=>{if(!$$('.ln-step.hide',el).length)markStage(id,'steps');};
 el.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const card=b.closest('.ex');const hidden=$$('.ln-step.hide',card);
  if(b.dataset.a==='next'&&hidden.length)hidden[0].classList.remove('hide');if(b.dataset.a==='all')hidden.forEach(h=>h.classList.remove('hide'));
  if(!$$('.ln-step.hide',card).length){$('[data-a=next]',card).disabled=true;$('[data-a=all]',card).disabled=true;}chk();});
}
function stPencil(el,id,D,pr){
 let p,counted,shown;
 const status=()=>`Correct answers: <b>${pr.pc||0}</b> · ${pr.pencil?'<span class="good">✓ Pencil step complete</span> — keep practicing or move on to Check.':'Get 2 correct to complete this step.'}`;
 const fresh=()=>{p=D.practice();counted=false;shown=false;draw();};
 const draw=()=>{el.innerHTML=`<div class="card"><div class="tag">Your turn</div><div class="pencilnote">✏️ <b>Pencil first:</b> work it out on paper — write each step and why. Then enter your answer.</div>
  <div class="prob">${p.q}</div>${p.fig||''}
  <div style="margin-top:8px">${p.type==='mc'?p.opts.map((o,i)=>`<button class="opt" data-o="${i}">${o}</button>`).join(''):p.fields.map((f,i)=>`<label class="fld">${f.label} <input data-f="${i}" autocomplete="off" inputmode="decimal"> ${f.unit||''}</label>`).join('')}</div>
  <div class="row">${p.type==='mc'?'':'<button class="primary" data-a="check">Check</button>'}${p.hint?'<button data-a="hint">💡 Hint</button>':''}${p.sol?'<button data-a="sol">Show solution</button>':''}<button data-a="new">New problem ↻</button></div>
  <div class="fb"></div>${p.sol?`<div class="solbox" hidden>${p.sol.map(l=>lineHTML(l,p.raw,false)).join('')}</div>`:''}<div class="streak">${status()}</div></div>`;
  const inp=$('input',el);if(inp)inp.focus({preventScroll:true});};
 const win=()=>{if(!counted&&!shown){counted=true;pr.pc=(pr.pc||0)+1;save();if(pr.pc>=2)markStage(id,'pencil');}$('.streak',el).innerHTML=status();};
 el.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const fb=$('.fb',el);
  if(b.dataset.o!==undefined){const i=+b.dataset.o;if(i===p.a){b.classList.add('right');fb.className='fb okk';fb.innerHTML='✓ Correct! '+(p.why||'');$$('.opt',el).forEach(x=>x.disabled=true);win();}else{b.classList.add('wrong');b.disabled=true;fb.className='fb no';fb.textContent='Not quite — look at the picture again and try another choice.';}return;}
  const a=b.dataset.a;
  if(a==='new')fresh();
  if(a==='hint'){fb.className='fb';fb.innerHTML='💡 '+p.hint;}
  if(a==='sol'){shown=true;$('.solbox',el).hidden=false;}
  if(a==='check'){const res=p.fields.map((f,i)=>{const v=parseAns($(`[data-f="${i}"]`,el).value);return !isNaN(v)&&Math.abs(v-f.answer)<=(f.tol||0.011);});
   const blank=p.fields.some((f,i)=>!$(`[data-f="${i}"]`,el).value.trim());
   if(blank){fb.className='fb no';fb.textContent='Enter an answer in every box first.';return;}
   p.fields.forEach((f,i)=>$(`[data-f="${i}"]`,el).style.borderColor=res[i]?'#15803d':'#b91c1c');
   if(res.every(Boolean)){fb.className='fb okk';fb.innerHTML='✓ Correct! Nice pencil work. Try another one with “New problem”.';win();}
   else{fb.className='fb no';fb.textContent='Not yet. Check your work step by step, or tap 💡 Hint.';}}});
 el.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('input')){const c=$('[data-a=check]',el);if(c)c.click();}});
 fresh();
}
function stCheck(el,id,D,pr){
 const sel=[];
 const draw=()=>{el.innerHTML=`<div class="card"><div class="tag">Quick check</div><p class="mute" style="margin-top:0">Answer all 3. Get at least 2 right to complete the lesson.</p>
  ${D.check.map((c,i)=>`<div class="qq" data-q="${i}"><b>${i+1}. ${c.q}</b>${c.o.map((o,j)=>`<button class="opt" data-q="${i}" data-j="${j}">${String.fromCharCode(65+j)}. ${o}</button>`).join('')}<div class="why">${c.why}</div></div>`).join('')}
  <div class="row"><button class="primary" data-a="submit">Submit</button></div><div id="res"></div></div>`;};
 draw();
 el.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.j!==undefined){const q=+b.dataset.q;if(el.dataset.locked)return;sel[q]=+b.dataset.j;$$(`.opt[data-q="${q}"]`,el).forEach(x=>x.classList.toggle('sel',+x.dataset.j===sel[q]));return;}
  if(b.dataset.a==='submit'){if(D.check.some((c,i)=>sel[i]===undefined)){$('#res',el).innerHTML='<p class="bad">Answer all 3 questions first.</p>';return;}
   el.dataset.locked=1;let score=0;
   D.check.forEach((c,i)=>{const ok=sel[i]===c.a;if(ok)score++;$(`.qq[data-q="${i}"]`,el).classList.add('shown');$$(`.opt[data-q="${i}"]`,el).forEach(x=>{const j=+x.dataset.j;x.classList.remove('sel');if(j===c.a)x.classList.add('right');else if(j===sel[i])x.classList.add('wrong');x.disabled=true;});});
   b.disabled=true;
   if(score>=2){pr.check=score;pr.done=true;save();markStage(id,'check');topProg();const nx=nextLesson(id);
    $('#res',el).innerHTML=`<div class="done-banner">🎉 ${score}/3 — Lesson complete!${nx?` <a class="btn primary" href="#/l/${nx}/0" style="margin-left:8px">Next lesson: ${META[nx].title} ▶</a>`:''}</div>`;}
   else $('#res',el).innerHTML=`<p class="bad">${score}/3. Read the explanations, review the Steps, then try again.</p><div class="row"><a class="btn" href="#/l/${id}/1">◀ Review Steps</a><button data-a="retry">Try again</button></div>`;}
  if(b.dataset.a==='retry'){delete el.dataset.locked;sel.length=0;draw();}});
}

function route(){const h=location.hash.replace(/^#\/?/,'').split('/');
 if(h[0]==='l'&&L[h[1]]){const s=Math.max(0,Math.min(3,+h[2]||0));renderLesson(h[1],s);}else{document.documentElement.style.setProperty('--acc','#2563eb');renderHome();}
 topProg();window.scrollTo(0,0);}
window.addEventListener('hashchange',route);route();
</script>
